name: CI

on:
  push:
    branches: [develop, master, feature/*]
    # CI 触发条件: 源代码 OR 构建依赖文件 OR Dockerfile OR 应用配置
    # 关键: pom.xml / package.json 改动必须触发 (依赖修复进不了镜像就是 2026-06-11 翻车重演)
    # application.yml 改动必须触发 (yml 是 resource 打进 jar, 改完必须重新 mvn package + build image)
    # 2026-06-12 翻车: 1bc8907 改 yml 没触发 CI, 镜像没更新, 217 还是旧代码
    # 文档类 (.md) 仍走手动 restart, 不触发 CI
    paths:
      # 后端 Java 源代码
      - 'code/platform-server/**.java'
      - 'code/platform-server/**/**.java'
      # 后端 Maven 依赖 (修复 a29813b 暴露的 CI paths 漏洞)
      - 'code/platform-server/**/pom.xml'
      - 'code/platform-server/pom.xml'
      # 后端应用配置 (yml 是 resource 打进 jar, 改完必须重新打包, 2026-06-12 修复)
      - 'code/platform-server/**/application.yml'
      - 'code/platform-server/**/**/application.yml'
      - 'code/platform-server/**/application.yaml'
      - 'code/platform-server/**/**/application.yaml'
      # 后端 Flyway 迁移 (sql 是 resource 打进 jar, V25/V27 修复 sys_tenant_app seed bug
      # 没触发 CI 是 2026-06-17 翻车: .sql 改动没 rebuild 镜像, 217 仍是旧 jar)
      - 'code/platform-server/**/db/migration/**.sql'
      - 'code/platform-server/**/**/db/migration/**.sql'
      # 前端 TS/Vue 源代码
      - 'code/platform-admin/src/**'
      - 'code/platform-ops-admin/src/**'
      # 前端 npm 依赖
      - 'code/platform-admin/package.json'
      - 'code/platform-admin/package-lock.json'
      - 'code/platform-ops-admin/package.json'
      - 'code/platform-ops-admin/package-lock.json'
      # 前端构建配置 (vite.config 改动必须触发 CI: base path / nginx 配置等场景)
      - 'code/platform-admin/vite.config.ts'
      - 'code/platform-admin/vite.config.*'
      - 'code/platform-admin/index.html'
      - 'code/platform-ops-admin/vite.config.ts'
      - 'code/platform-ops-admin/vite.config.*'
      - 'code/platform-ops-admin/index.html'
      # 前端 nginx 配置 (修复 2026-06-12 gateway 容器 IP 变更 502 — 同 154da52 同类漏洞)
      - 'code/platform-admin/nginx.conf'
      - 'code/platform-admin/**/nginx.conf'
      - 'code/platform-ops-admin/nginx.conf'
      - 'code/platform-ops-admin/**/nginx.conf'
      # Docker 镜像配置
      - 'code/platform-server/Dockerfile'
      - 'code/platform-server/Dockerfile.*'
      - 'code/platform-admin/Dockerfile'
      - 'code/platform-admin/Dockerfile.*'
      - 'code/platform-ops-admin/Dockerfile'
      - 'code/platform-ops-admin/Dockerfile.*'
      # platform-kefu (Python + Vue 3, Docker 化)
      - 'code/platform-kefu/**'
      - 'code/platform-kefu-frontend/**'
      # 容器资源监控导出器 (2026-06-15 添加: 把 exporter.py 打进镜像, 217 上只 docker compose pull)
      - 'scripts/container-exporter/**'
      - 'scripts/container-exporter/Dockerfile'
      - 'scripts/container-exporter/Dockerfile.*'
      # CI 自身变更 (docker-compose.yml, ci.yml) 必须能触发构建
      - 'docker-compose.yml'
      - '.github/workflows/**'
      # 密钥扫描相关配置 (2026-09-28) — 这些改动必须触发 secret-scan job
      - 'scripts/ci/check-jwt-secret-alignment.sh'
      - '.githooks/pre-commit'
      - '.gitignore'
      - 'code/platform-server/config/common.yml'
      - 'code/platform-server/platform-common/**/JwtUtil.java'
      - 'code/platform-kefu/app/config.py'
      - 'code/platform-kefu/tests/**'
      # 测试/评估/同步校验 (2026-10-09 新增: evals 目录与 AGENTS/Claude 同步校验脚本必须触发 CI)
      - 'evals/**'
      - 'scripts/ci/check-agents-claude-sync.sh'
  pull_request:
    branches: [develop, master]
    paths:
      - 'code/platform-server/**.java'
      - 'code/platform-server/**/**.java'
      - 'code/platform-server/**/pom.xml'
      - 'code/platform-server/pom.xml'
      - 'code/platform-server/**/application.yml'
      - 'code/platform-server/**/**/application.yml'
      - 'code/platform-server/**/db/migration/**.sql'
      - 'code/platform-server/**/**/db/migration/**.sql'
      - 'code/platform-admin/src/**'
      - 'code/platform-ops-admin/src/**'
      - 'code/platform-admin/package.json'
      - 'code/platform-admin/package-lock.json'
      - 'code/platform-ops-admin/package.json'
      - 'code/platform-ops-admin/package-lock.json'
      - 'code/platform-admin/nginx.conf'
      - 'code/platform-admin/**/nginx.conf'
      - 'code/platform-ops-admin/nginx.conf'
      - 'code/platform-ops-admin/**/nginx.conf'
      - 'code/platform-server/Dockerfile'
      - 'code/platform-server/Dockerfile.*'
      - 'code/platform-admin/Dockerfile'
      - 'code/platform-admin/Dockerfile.*'
      - 'code/platform-ops-admin/Dockerfile'
      - 'code/platform-ops-admin/Dockerfile.*'
      # 容器资源监控导出器 (2026-06-15 添加)
      - 'scripts/container-exporter/**'
      - 'scripts/container-exporter/Dockerfile'
      - 'scripts/container-exporter/Dockerfile.*'
      # 密钥扫描相关配置 (2026-09-28)
      - 'scripts/ci/check-jwt-secret-alignment.sh'
      - '.githooks/pre-commit'
      - '.gitignore'
      - 'code/platform-server/config/common.yml'
      - 'code/platform-server/platform-common/**/JwtUtil.java'
      - 'code/platform-kefu/app/config.py'
      - 'code/platform-kefu/tests/**'
      # 测试/评估/同步校验 (2026-10-09 新增: evals 目录与 AGENTS/Claude 同步校验脚本必须触发 CI)
      - 'evals/**'
      - 'scripts/ci/check-agents-claude-sync.sh'
      - 'docker-compose.yml'
      - '.github/workflows/**'

env:
  MAVEN_OPTS: -Dorg.slf4j.simpleLogger.log.org.apache.maven.plugins=warn

jobs:
  # =============================================
  # 密钥泄漏扫描 (2026-09-28 新增)
  # 轻量 job, 不依赖 JDK/Node/Maven, 失败最快 — 优先于编译暴露密钥问题
  # 背景: 2026-09-28 安全审计发现 login-resp.json (含管理员 JWT) 与
  #       temp_login.json (明文 admin/123456) 已被提交进 git, 且 check-jwt-secret-alignment.sh
  #       写好了却从未接入 CI, 导致 KNOWN_ISSUES #36 反复复发.
  # =============================================
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JWT_SECRET alignment
        run: bash scripts/ci/check-jwt-secret-alignment.sh

      - name: Hardcoded secret scan (tracked files)
        run: |
          set -o pipefail
          echo "Scanning $(git ls-files | wc -l) tracked files..."
          # 与 .githooks/pre-commit 同源的三类高危字面量:
          #   sk-...            LLM API key (OpenAI/DeepSeek/SiliconFlow/Agnes)
          #   AQ....            Google AI Studio key
          #   eyJ.a.b            JWT (泄露的登录 token)
          if git ls-files -z | xargs -0 grep -lIE \
            'sk-[A-Za-z0-9_-]{20,}|AQ\.[A-Za-z0-9_-]{30,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' \
            2>/dev/null; then
            echo "::error::检测到疑似硬编码密钥 (见上方文件列表), 提交被拒绝"
            exit 1
          fi
          echo "OK: 已跟踪文件中未发现高危密钥字面量"

      - name: Sensitive artifacts must not be tracked
        run: |
          fail=0
          for f in login-resp.json temp_login.json aistudio.google.com.json; do
            if git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
              echo "::error::$f 是敏感凭据产物, 不允许进入 git (2026-09-28 已从跟踪中移除)"
              fail=1
            fi
            if git ls-files | grep -qE "(^|/)$f$"; then
              echo "::error::任意子目录下存在被跟踪的 $f"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "OK: 无敏感凭据产物被跟踪"
          exit $fail

  # =============================================
  # 后端编译 (测试由本地 pre-push hook 保证)
  # =============================================
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: |
          cd code/platform-server
          mvn clean package -DskipTests
          
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            code/platform-server/platform-user/target/*.jar
            code/platform-server/platform-auth/target/*.jar
            code/platform-server/platform-gateway/target/*.jar
            code/platform-server/platform-workflow/target/*.jar
            code/platform-server/platform-message/target/*.jar
            code/platform-server/platform-ops/target/*.jar
            code/platform-server/park-space/target/*.jar
            code/platform-server/park-property/target/*.jar
            code/platform-server/park-contract/target/*.jar
            code/platform-server/park-enterprise/target/*.jar
          retention-days: 3

  # =============================================
  # 前端编译（管理后台）
  # =============================================
  frontend-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/platform-admin/package-lock.json

      - name: Install & Build (含 vue-tsc 类型门禁)
        run: |
          cd code/platform-admin
          npm install --legacy-peer-deps
          npm run build:check

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-admin-dist
          path: code/platform-admin/dist
          retention-days: 3

  # =============================================
  # 前端编译（运营后台）
  # =============================================
  frontend-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/platform-ops-admin/package-lock.json

      - name: Build (含 vue-tsc 类型门禁)
        run: |
          cd code/platform-ops-admin
          npm install
          npm run build:check

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ops-dist
          path: code/platform-ops-admin/dist
          retention-days: 3

  # =============================================
  # Docker 镜像构建（仅 develop/master 分支）
  # =============================================
  docker:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'
    steps:
      # fetch-depth: 0 — 必需。默认 fetch-depth: 1 是浅克隆, 本地不存在 HEAD^,
      # 导致下面 Build & Push 里的 `git diff --name-only HEAD^ HEAD` 返回空,
      # 改动文件列表拿不到 → 回退全量构建 → 选择性构建完全失效 (2026-09-29 实测)。
      # 本仓库已验证: 浅克隆下该命令输出为空字符串。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build all
        run: |
          # 编译后端
          cd code/platform-server
          mvn clean package -DskipTests

          # 编译前端
          cd "$GITHUB_WORKSPACE/code/platform-admin"
          npm install --legacy-peer-deps && npm run build

          cd "$GITHUB_WORKSPACE/code/platform-ops-admin"
          npm install && npm run build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 阿里云 ACR 双推已于 2026-09-30 移除 —— 只推 ghcr。
      #
      # 为什么移除 (实测数据, 不是猜测):
      #   GitHub runner -> ghcr : 15/15 全部成功, 秒级
      #   GitHub runner -> ACR  : 同一轮 15 个并行上传, 7 成功 8 超时 (600s 被掐)
      # ACR 方向本来是好的: 142 拉 ACR 只要 9 秒。坏的是**境外 runner 往 ACR 上传**
      # 这一个环节 —— 15 个镜像同时灌进个人版实例, 互相踩, 一半饿死到超时。
      # 它又挂在部署源上 (失败即 job 红), 于是"CI 红了但其实和代码无关", 两次卡住发版。
      #
      # 为什么不修而是直接砍掉: 保留 ACR 就必须长期维护它的上传可靠性
      # (提超时 / 降并发 / 重试), 而收益仅仅是"142 拉快一点"。ghcr 推送 100% 可靠,
      # 142 拉慢是可观测、可重试的, 不会让发版流程随机失败。
      #
      # ACR 凭据 secrets(ALIYUN_ACR_*) 保留未删 —— 哪天想要国内加速,
      # 用一台国内主机拉 ghcr 转推 ACR 即可 (image-syncer 干这个),
      # 不需要再动 CI。
      - name: Build & Push Images
        run: |
          set -euo pipefail

          # === 基础镜像预拉取 (2026-09-29) ===
          # 背景: 10 个后端镜像的 Dockerfile FROM 全是 eclipse-temurin:21-jdk-alpine
          # (~400MB), 加上 node/python/nginx 共 12 处 FROM。runner 上无基础镜像缓存时,
          # 每个 build 各自走一遍网络拉取, 串行叠加后卡在 "Waiting" (实测一次 31 分钟,
          # 历史基线 13-17 分钟)。这里先串行预拉一次, 让后续 12 次 build 全部命中
          # 本地层缓存; 失败不阻断 (网络抖动时仍可退回按需拉取)。
          echo "::group::Pre-pulling base images"
          for BASE in eclipse-temurin:21-jdk-alpine node:20-alpine node:22-alpine \
                      python:3.12-slim nginx:alpine; do
            echo "-- pulling $BASE"
            docker pull "$BASE" || echo "::warning::pre-pull failed for $BASE (继续, 构建时按需拉取)"
          done
          echo "::endgroup::"

          # 单仓库推送队列 (2026-09-30: ACR 双推已移除, ghcr 是唯一推送源 + 部署源)
          #
          # 保留后台并行: 串行推送时后面的 build 全排队, 表现为"卡在同一个地方不动"。
          # 但**失败必须如实传出** —— ghcr 现在是部署依赖, 静默失败等于流水线绿灯
          # 而 142 拉不到镜像 (这正是之前 ACR 被设为阻塞源的原因, 现在对 ghcr 同理)。
          _GHCR_PIDS=(); _GHCR_NAMES=()

          # 构建并推送镜像
          # 用法: build_and_push <context> [Dockerfile] <ghcr-img> <组件名>
          build_and_push() {
            local _ctx="$1" _df="$2" _ghcr_tag="$3" _name="$4"
            # --pull=false: 基础镜像层已在上面的预拉取阶段落地, 禁止每次 build 再联网检查更新。
            # 这既缩短耗时, 也避开 Docker Hub 匿名拉取的速率限制导致的 "Waiting" 挂起。
            if [ "$_df" = "-" ]; then
              docker build --pull=false -t "$_ghcr_tag" "$_ctx"
            else
              docker build --pull=false -f "$_df" -t "$_ghcr_tag" "$_ctx"
            fi

            (
              if timeout 900 docker push "$_ghcr_tag"; then
                echo "ghcr push OK: $_ghcr_tag"
              else
                echo "::error::ghcr 推送失败或超过 900s: $_ghcr_tag (部署源, 必须成功)"
                exit 1
              fi
            ) &
            _GHCR_PIDS+=("$!"); _GHCR_NAMES+=("$_ghcr_tag")
          }

          # 收尾: 等 ghcr。失败 -> 非零退出 -> job 红。
          # 必须在同一个 step 内 wait —— step 结束时空后台进程会被 runner 杀掉。
          wait_ghcr_pushes() {
            local _failed=0
            if [ "${#_GHCR_PIDS[@]}" -eq 0 ]; then
              echo "::error::没有推送任何镜像, 构建计划可能全被跳过"
              return 1
            fi
            echo "等待 ${#_GHCR_PIDS[@]} 个 ghcr 推送 (部署源, 已并行, 每个最多 900s)..."
            local _i
            for _i in "${!_GHCR_PIDS[@]}"; do
              if wait "${_GHCR_PIDS[$_i]}"; then
                echo "  [OK] ${_GHCR_NAMES[$_i]}"
              else
                echo "  [FAIL] ${_GHCR_NAMES[$_i]}"
                _failed=1
              fi
            done
            if [ "$_failed" != "0" ]; then
              echo "::error::有 ghcr 镜像推送失败 —— ghcr 是 142 的部署源, 必须全部成功"
              return 1
            fi
            echo "ghcr (部署源) 全部推送成功"
          }

          # === 按改动范围选择要构建的镜像 (2026-09-29) ===
          # 背景: 原实现无条件全量构建 15 个镜像 (10 后端 + 3 前端 + kefu + exporter)
          # 并逐个推送。改一个 kefu 文件也要重建 9 个 ~800MB 的 Java 镜像,
          # 实测耗时 11-17 分钟 (#235/#236), 而纯 CI 配置改动只要 4-5 分钟 (#232)。
          # 这里用 git diff 算出改动文件, 只重建受影响的镜像。
          # 安全性: 拿不到 diff (首次 push / force push / 浅克隆) 时回退到全量构建,
          # 保证不会出现"该构建的镜像没构建"的静默漏构建。
          CHANGED=$(git diff --name-only "HEAD^" HEAD 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            # 用 warning 而非 notice: 降级成全量构建会把 4 分钟的 run 拖到 15+ 分钟,
            # 这属于"优化静默失效", 必须在 Actions 页面上一眼看见。
            echo "::warning::无法获取改动文件列表 (浅克隆 / 首次 push / 无父提交), 本轮回退全量构建, 耗时约 15 分钟。检查 checkout 的 fetch-depth 是否为 0。"
            BUILD_ALL=1
          else
            BUILD_ALL=0
            echo "::group::Changed files"
            echo "$CHANGED"
            echo "::endgroup::"
          fi

          # should_build <正则> — 改动命中正则则返回 0
          should_build() {
            [ "$BUILD_ALL" = "1" ] && return 0
            echo "$CHANGED" | grep -qE "$1"
          }

          # platform-server/**.java / pom / yml / Dockerfile → 全部后端都受影响
          # (共享 platform-common 与父 pom, 单点改动无法安全只重建一个)
          BUILD_BACKEND=0
          if should_build '^code/platform-server/'; then BUILD_BACKEND=1; fi
          # docker-compose.yml / CI 自身 / 通用配置 → 全部镜像都受影响
          if should_build '^(docker-compose\.yml|\.github/workflows/|code/platform-server/config/|scripts/ci/)'; then
            BUILD_ALL=1; BUILD_BACKEND=1
          fi
          BUILD_KEFU=0;      if should_build '^code/platform-kefu/'; then BUILD_KEFU=1; fi
          BUILD_ADMIN=0;     if should_build '^code/platform-admin/'; then BUILD_ADMIN=1; fi
          BUILD_OPSADM=0;    if should_build '^code/platform-ops-admin/'; then BUILD_OPSADM=1; fi
          BUILD_KEFUFE=0;    if should_build '^code/platform-kefu-frontend/'; then BUILD_KEFUFE=1; fi
          BUILD_EXPORTER=0;  if should_build '^scripts/container-exporter/'; then BUILD_EXPORTER=1; fi

          echo "构建计划: backend=$BUILD_BACKEND kefu=$BUILD_KEFU admin=$BUILD_ADMIN ops-admin=$BUILD_OPSADM kefu-fe=$BUILD_KEFUFE exporter=$BUILD_EXPORTER all=$BUILD_ALL"

          # 后端镜像
          declare -A DF_MAP
          DF_MAP[platform-user]=Dockerfile
          DF_MAP[platform-auth]=Dockerfile.auth
          DF_MAP[platform-gateway]=Dockerfile.gateway
          DF_MAP[platform-workflow]=Dockerfile.workflow
          DF_MAP[platform-message]=Dockerfile.message
          DF_MAP[platform-ops]=Dockerfile.ops
          DF_MAP[park-space]=Dockerfile.space
          DF_MAP[park-property]=Dockerfile.property
          DF_MAP[park-contract]=Dockerfile.contract
          DF_MAP[park-enterprise]=Dockerfile.enterprise

          if [ "$BUILD_BACKEND" = "1" ]; then
            cd code/platform-server
            for svc in platform-user platform-auth platform-gateway platform-workflow platform-message platform-ops park-space park-property park-contract park-enterprise; do
              img="ghcr.io/${{ github.repository }}/${svc}:latest"
              echo "Building $img"
              build_and_push . "${DF_MAP[$svc]}" "$img" "$svc"
            done
          else
            echo "跳过 10 个后端镜像 (无 platform-server 改动)"
          fi

          # 前端镜像 (回到 GITHUB_WORKSPACE 后才能引用 ./code/platform-kefu)
          cd "$GITHUB_WORKSPACE"

          # platform-kefu 后端 (Python FastAPI)
          if [ "$BUILD_KEFU" = "1" ]; then
            img="ghcr.io/${{ github.repository }}/platform-kefu:latest"
            echo "Building $img"
            build_and_push "./code/platform-kefu" "-" "$img" "platform-kefu"
          else
            echo "跳过 platform-kefu (无 kefu 改动)"
          fi

          # 其他前端镜像 (platform-admin / ops-admin / platform-kefu-frontend)
          if [ "$BUILD_ADMIN" = "1" ]; then
            img="ghcr.io/${{ github.repository }}/platform-admin:latest"
            echo "Building $img"
            build_and_push "./code/platform-admin" "-" "$img" "platform-admin"
          else
            echo "跳过 platform-admin"
          fi
          if [ "$BUILD_OPSADM" = "1" ]; then
            img="ghcr.io/${{ github.repository }}/platform-ops-admin:latest"
            echo "Building $img"
            build_and_push "./code/platform-ops-admin" "-" "$img" "platform-ops-admin"
          else
            echo "跳过 platform-ops-admin"
          fi
          if [ "$BUILD_KEFUFE" = "1" ]; then
            img="ghcr.io/${{ github.repository }}/platform-kefu-frontend:latest"
            echo "Building $img"
            build_and_push "./code/platform-kefu-frontend" "-" "$img" "platform-kefu-frontend"
          else
            echo "跳过 platform-kefu-frontend"
          fi

          # 容器资源监控导出器 (2026-06-15 添加: 把 exporter.py 打进镜像, 217 上只 docker compose pull)
          if [ "$BUILD_EXPORTER" = "1" ]; then
            img="ghcr.io/${{ github.repository }}/platform-container-exporter:latest"
            echo "Building $img"
            build_and_push "./scripts/container-exporter" "-" "$img" "platform-container-exporter"
          else
            echo "跳过 platform-container-exporter"
          fi

          # 全部镜像构建完成 → 收尾推送。
          # ghcr 是 142 的部署源, 它的成败决定 job 成败。
          # 已并行执行, 这里只是等结果, 不再额外消耗构建时间。
          wait_ghcr_pushes

  # =============================================
  # 多租户拦截器回滚开关验证 (P0-1 实施)
  # =============================================
  # 配套: doc/P0-1-回滚开关设计.md 方案 A
  # 作用: 验证 MybatisPlusConfig + 6 个 application.yml 已正确实施
  #       ConditionalOnProperty 开关, 紧急时可秒级关闭
  # 触发: 所有 push 和 PR
  # =============================================
  tenant-interceptor-toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run toggle verification script
        run: bash scripts/ci/check-tenant-interceptor-toggle.sh

      - name: Annotate results
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ P0-1 多租户拦截器回滚开关验证通过"
          else
            echo "❌ P0-1 多租户拦截器回滚开关验证失败 - 见上方日志"
            exit 1
          fi

  # =============================================
  # 后端测试 (2026-10-09 新增, 补 CI playbook §8.4 缺口)
  # backend job 只做编译打包 (-DskipTests), 全量测试在此 job 独立跑
  # 实测基线 (2026-10-08 本地): mvn -o clean test 共 524 个, 0 失败
  # =============================================
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run all backend tests
        run: cd code/platform-server && mvn -B clean test

  # =============================================
  # 前端测试 (2026-10-09 新增: 补 3 个前端的 vitest 门禁)
  # 现状基线: platform-admin 有 vitest; ops-admin / kefu-frontend 无测试,
  # 对应 npm run test 若缺脚本会直接失败 —— 属预期红, 补脚本后转绿
  # =============================================
  frontend-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [platform-admin, platform-ops-admin, platform-kefu-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # platform-admin 依赖树有 peer-deps 冲突必须 --legacy-peer-deps, 其余包直接装
      - name: Install dependencies (${{ matrix.pkg }})
        run: |
          cd code/${{ matrix.pkg }}
          if [ "${{ matrix.pkg }}" = "platform-admin" ]; then
            npm install --legacy-peer-deps
          else
            npm install
          fi

      - name: Run tests (${{ matrix.pkg }})
        run: cd code/${{ matrix.pkg }} && npm run test

  # =============================================
  # 客服后端测试 (2026-10-09 新增: pytest 全量, 本地基线 73 passed / 2 skipped)
  # =============================================
  kefu-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r code/platform-kefu/requirements.txt pytest

      - name: Run pytest
        run: cd code/platform-kefu && python -m pytest tests -q

  # =============================================
  # AI 评估套件 (2026-10-09 新增: evals/run.sh, 需要 kefu 的 Python 依赖)
  # =============================================
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r code/platform-kefu/requirements.txt pytest

      - name: Run evals
        run: bash evals/run.sh

  # =============================================
  # AGENTS/Claude 双文档同步校验 (2026-10-09 新增)
  # AGENTS.md 与 .claude/CLAUDE.md 保持同源, 该脚本校验一致性
  # =============================================
  harness-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check AGENTS/Claude sync
        run: bash scripts/ci/check-agents-claude-sync.sh
