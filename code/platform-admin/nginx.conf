server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS 解析器（防止容器重启后 502）
    resolver 127.0.0.11 valid=10s;

    # SPA 前端路由（所有非 API 请求返回 index.html）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # 静态资源缓存
    location /assets/ {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # =====================================================
    # 统一 API 网关入口（platform-gateway:8083）
    # =====================================================

    # SSE 推送（必须单独处理：流式响应 + 长连接）
    location /api/message/sse/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://platform-gateway:8083;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API 请求（strip /api 前缀后转发给网关）
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://platform-gateway:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Knife4j / Swagger 页面资源（不走 /api 前缀的静态资源）
    location ~ ^/(v3/api-docs|swagger-ui|webjars)/ {
        proxy_pass http://platform-gateway:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # doc.html 精确匹配
    location = /doc.html {
        proxy_pass http://platform-gateway:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
