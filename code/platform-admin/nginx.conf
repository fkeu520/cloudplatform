server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS 解析器（防止容器重启后 502）
    resolver 127.0.0.11 valid=10s;

    # 前端路由重写 + 禁用缓存
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # 静态资源缓存控制
    location /assets/ {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 工作流 API 代理（必须放在 /api/ 之前，否则被 /api/ 拦截）
    location /api/workflow/ {
        rewrite ^/api/workflow/(.*)$ /workflow/$1 break;
        proxy_pass http://platform-workflow:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 消息中心 API 代理（必须放在 /api/ 之前）
    location /api/message/ {
        rewrite ^/api/message/(.*)$ /message/$1 break;
        proxy_pass http://platform-message:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API 代理
    location /api/ {
        proxy_pass http://platform-user:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 工作流 API 代理（直接路径）
    location /workflow/ {
        proxy_pass http://platform-workflow:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 运营管理 API 代理
    location /tenant/ { proxy_pass http://platform-ops:8087; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /storage/ { proxy_pass http://platform-ops:8087; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /gateway-route/ { proxy_pass http://platform-ops:8087; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /audit/ { proxy_pass http://platform-ops:8087; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /app/ { proxy_pass http://platform-ops:8087; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /tenant-app/ { proxy_pass http://platform-ops:8087; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

    # Knife4j API 文档代理
    location /doc.html {
        proxy_pass http://platform-user:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /webjars/ {
        proxy_pass http://platform-user:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /v3/ {
        proxy_pass http://platform-user:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /swagger-ui/ {
        proxy_pass http://platform-user:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}