server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # =====================================================
    # Docker DNS 解析器 (修复 2026-06-12 gateway 容器 IP 变更导致 502)
    # =====================================================
    # 之前: 静态 proxy_pass http://platform-gateway:8083, nginx 启动时解析一次后缓存 IP。
    #       gateway 容器被重建后 IP 变了, nginx 仍用旧 IP → connection refused → 502。
    # 现在: resolver 指向 Docker embedded DNS (127.0.0.11), valid=10s 强制每 10s 重新解析。
    #       proxy_pass 必须用变量形式 ($backend) 才能触发 resolver, 静态 URL 仍会缓存。
    # =====================================================
    resolver 127.0.0.11 valid=10s ipv6=off;

    # =====================================================
    # 上传大小上限 (2026-09-30)
    # =====================================================
    # 不配的话 nginx 用默认 1m, 于是:
    #   - 后端 kefu 允许 max_file_size_mb=50
    #   - 前端经本层 /api/ 上传 >1MB 的文档 -> nginx 直接 413
    #   - 请求根本到不了 kefu, kefu 访问日志里看不到任何记录
    # 实测: 2MB 真实文档经 8080 -> 413; 同一文件直连 kefu:8050 -> 200 (179 chunks)。
    # 取 50m 与 platform-kefu 的 max_file_size_mb 对齐。
    client_max_body_size 50m;

    # SPA 前端路由（所有非 API 请求返回 index.html）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # 静态资源缓存
    location /assets/ {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # =====================================================
    # 统一 API 网关入口（platform-gateway:8083）
    # =====================================================

    # SSE 推送（必须单独处理：流式响应 + 长连接）
    location /api/message/sse/ {
        set $backend http://platform-gateway:8083;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API 请求（strip /api 前缀后转发给网关）
    location /api/ {
        set $backend http://platform-gateway:8083;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Knife4j / Swagger 页面资源（不走 /api 前缀的静态资源）
    location ~ ^/(v3/api-docs|swagger-ui|webjars)/ {
        set $backend http://platform-gateway:8083;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # doc.html 精确匹配
    location = /doc.html {
        set $backend http://platform-gateway:8083;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 智能问答 SPA 嵌入: 不在这里代理 /kefu/!
    # 历史背景: 之前 platform-admin 容器也代理 /kefu/ → kefu-frontend,
    # 导致 platform-admin 的 vue-router 永远收不到 /kefu/chat 等路由,
    # iframe wrapper (KefuIframe.vue) 永远不会渲染.
    # 现在改用云端 nginx (cloudhub) 代理 /kefu-frontend/ → kefu-frontend:8060,
    # iframe src 改为 /kefu-frontend/#/chat 等, 走外层 cloudflared 转发.
    # /kefu/* 路径走 SPA fallback (上面的 location / try_files), 由 vue-router 处理.
    #
    # 2026-09-28 修复: 补 /kefu-frontend/ 代理 (直连 8080 白屏)
    # 之前 cloudhub(443) 有 /kefu-frontend/ → 8060, 但 admin(8080) 没有.
    # 局域网直连 http://192.168.0.142:8080/kefu/chat 时, iframe src 是 /kefu-frontend/#/chat,
    # 落到本容器 SPA fallback → admin 自己有 history 路由但没有 /kefu-frontend/ 匹配
    # → iframe 主区空白. 新增 location 直连 kefu-frontend 容器, 与 /kefu/ 解耦.
    # 2026-09-30: 补回 rewrite —— 142 上运行的容器里一直有这一行, 但仓库文件漏了,
    # 导致每次重建 platform-admin 镜像都会把它冲掉, /kefu-frontend/ 立刻白屏。
    # 必须 strip 前缀: 不 strip 的话 Vite 静态资源会按 /kefu-frontend/assets/x.js
    # 去请求, 前端容器的 SPA fallback 回 index.html, 浏览器按 JS 解析报 MIME 错误。
    location /kefu-frontend/ {
        set $kefu_fe http://platform-kefu-frontend:80;
        rewrite ^/kefu-frontend/(.*)$ /$1 break;
        proxy_pass $kefu_fe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
