server:
  port: 8083
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:80}
      min-spare: ${TOMCAT_THREADS_MIN:10}
    accept-count: 100
    max-connections: 2000
    connection-timeout: 20s
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  main:
    web-application-type: reactive

  http:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

  application:
    name: platform-gateway

  config:
    import:
      - optional:nacos:common.yml

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springdoc.webmvc.autoconfigure.SpringDocWebMvcAutoConfiguration
      - com.github.xiaoymin.knife4j.spring.configuration.Knife4jAutoConfiguration

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 2
      connection-timeout: 20000
      max-lifetime: 1800000
      idle-timeout: 600000
      pool-name: ${spring.application.name}-pool

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        # 鍚姩鏃跺厑璁?Nacos gRPC 瀹㈡埛绔湭灏辩华,閬垮厤 Docker Desktop 閲嶅惎鏃?Nacos 杩樺湪 STARTING
        # 瀵艰嚧 "Failed to start bean 'webServerStartStop'" 缃戝叧鏃犳硶鍚姩
        fail-fast: false
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        enabled: false

    gateway:
      # 浣跨敤 Apache HTTP Client锛堥伩鍏?Netty Connection refused 闂锛?
      httpclient:
        type: apache
        connect-timeout: 5000
        response-timeout: 5s
        pool:
          type: elastic
          max-idle-time: 60s

      # 鍏ㄥ眬 CORS 閰嶇疆
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ORIGINS:*}
            allowed-methods: '*'
            allowed-headers: '*'
            allow-credentials: false
            max-age: 3600

      # 璺敱閰嶇疆锛堥€氳繃 Nacos 鏈嶅姟鍙戠幇 lb:// 鏂瑰紡锛岄€傜敤浜?Docker 鍜屾湰鍦板紑鍙戯級
      routes:
        # 鐢ㄦ埛涓績
        - id: platform-user
          uri: lb://platform-user
          predicates:
            - Path=/user/**, /role/**, /menu/**, /dict/**, /config/**, /org/**, /dept/**, /post/**, /oper-log/**, /login-log/**, /dashboard/**
          filters:
            - name: CircuitBreaker
              args:
                name: platform-user-cb
                fallbackUri: forward:/fallback/user
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE

        # 鍥绌洪棿 (W3.1 Room + W3.3-W3.6 15 实体)
        - id: park-space
          uri: lb://park-space
          predicates:
            - Path=/room/**, /park/**, /area/**, /floor/**, /building/**, /kit/**, /plan-use/**, /land-nature/**, /covenant/**, /equipment/**, /space-category/**, /space/**, /massif/**, /room-purpose/**, /room-lock-record/**, /room-record/**, /room-split-merge/**
          filters:
            - name: CircuitBreaker
              args:
                name: park-space-cb
                fallbackUri: forward:/fallback/space
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE

        # 鍥尯鍚堝悓 (W3.2b)
        - id: park-contract
          uri: lb://park-contract
          predicates:
            - Path=/contract/**
          filters:
            - name: CircuitBreaker
              args:
                name: park-contract-cb
                fallbackUri: forward:/fallback/contract
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE

        # 璁よ瘉涓績
        - id: platform-auth
          uri: lb://platform-auth
          predicates:
            - Path=/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: platform-auth-cb
                fallbackUri: forward:/fallback/auth

        # 杩愯惀绠＄悊鏈嶅姟
        - id: platform-ops
          uri: lb://platform-ops
          predicates:
            - Path=/tenant/**, /storage/**, /gateway-route/**, /audit/**, /app/**, /tenant-app/**, /ops/**, /ops-user/**
          filters:
            - name: CircuitBreaker
              args:
                name: platform-ops-cb
                fallbackUri: forward:/fallback/ops

        # 娴佺▼涓績
        - id: platform-workflow
          uri: lb://platform-workflow
          predicates:
            - Path=/workflow/**
          filters:
            - name: CircuitBreaker
              args:
                name: platform-workflow-cb
                fallbackUri: forward:/fallback/workflow

        # 娑堟伅涓績
        - id: platform-message
          uri: lb://platform-message
          predicates:
            - Path=/message/**
          filters:
            - name: CircuitBreaker
              args:
                name: platform-message-cb
                fallbackUri: forward:/fallback/message

        # 缃戝叧鑷韩绠＄悊鎺ュ彛
        - id: platform-gateway-self
          uri: lb://platform-gateway
          predicates:
            - Path=/gateway/**
          filters:
            - name: CircuitBreaker
              args:
                name: platform-gateway-self-cb
                fallbackUri: forward:/fallback/gateway

        # Swagger / API 鏂囨。
        - id: platform-api-docs
          uri: lb://platform-gateway
          predicates:
            - Path=/v3/api-docs/**, /swagger-ui/**, /webjars/**, /doc.html

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX:20}
          max-idle: ${REDIS_POOL_MAX:20}
          min-idle: 2
          max-wait: 2s
  lifecycle:
    timeout-per-shutdown-phase: 30s

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.cloudhub.platform: DEBUG

# ============ 澶氱鎴锋嫤鎴櫒寮€鍏?(P0-1 鍥炴粴寮€鍏? ============
# 閰嶅鏂囨。: doc/P0-1-鍥炴粴寮€鍏宠璁?md 鏂规 A
# 榛樿 true (鎷︽埅鍣ㄥ姞杞? 褰撳墠琛屼负)
# 绱ф€ュ洖婊? 璁剧疆鐜鍙橀噺 PLATFORM_TENANT_INTERCEPTOR_ENABLED=false 鍚庨噸鍚?
# 鍏抽棴鍚庢墍鏈?SQL 涓嶅啀鑷姩鎷兼帴 tenant_id 鏉′欢, 涓氬姟鍥炲埌 v3.1 涔嬪墠琛屼负
# ============ 鏁版嵁鏉冮檺鍗囩骇寮€鍏?(v7.1 PR1-4 鍏辩敤, 鍐崇瓥 3 v1.1) ============
# 閰嶅鏂囨。: doc/椤圭洰杩涘害.md v7.1 搂7.2
# 榛樿 false (璧?v7.0 琛屼负), 楠岃瘉娴佺▼閫氳繃鍚庣敤鎴锋媿鏉挎敼 true
# 绱ф€ュ洖婊? 璁剧疆鐜鍙橀噺 PLATFORM_DATA_SCOPE_UPGRADE_ENABLED=false 鍚庨噸鍚?
# 鍏抽棴鍚庤蛋 v7.0 琛屼负 (鑰?DFS 搴旂敤灞傞€掑綊, 鏃犵鎴疯繃婊?
platform:
  tenant:
    interceptor:
      enabled: ${PLATFORM_TENANT_INTERCEPTOR_ENABLED:true}
  data-scope:
    upgrade:
      enabled: ${PLATFORM_DATA_SCOPE_UPGRADE_ENABLED:false}
      # M5 P0-2 PR4: 写严格模式 (默认 false 安全降级, true 时 fail-closed)
      # false: SQL 解析失败/禁用语法 (FORCE INDEX) 记 WARN 放行, 业务可用但无 data scope
      # true:  解析失败抛 DataScopeViolationException, 阻止执行 (写操作零越权)
      # 紧急回滚: PLATFORM_DATA_SCOPE_UPGRADE_WRITE_STRICT=false 重启
      write-strict: ${PLATFORM_DATA_SCOPE_UPGRADE_WRITE_STRICT:true}

# ============ 链路追踪 (M6 P1-1) ============
management:
  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# ============ M6 P3-6: 网关韧性 (熔断/限流/超时) ============
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        sliding-window-type: COUNT_BASED
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.cloud.gateway.support.TimeoutException
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
        cancel-running-future: true

