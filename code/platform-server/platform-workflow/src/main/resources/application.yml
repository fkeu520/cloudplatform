server:
  port: 8084

spring:
  application:
    name: platform-workflow

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        # 鍚姩鏃跺蹇?Nacos gRPC 瀹㈡埛绔湭灏辩华
        fail-fast: false
      config:
        import-check:
          enabled: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: platform
    password: platform123

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: taskNotify:com.cloudhub.platform.workflow.notify.TaskNotifyMessage
        max.block.ms: 3000
        request.timeout.ms: 3000
    consumer:
      group-id: workflow-task-notify
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: taskNotify:com.cloudhub.platform.workflow.notify.TaskNotifyMessage
        spring.json.trusted.packages: com.cloudhub.platform.workflow
        max.poll.interval.ms: 5000
    topic:
      task-notify: task-notify
      workflow-message: workflow-message

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    table: flyway_schema_history_workflow

flowable:
  database-schema-update: true
  async-executor-activate: true
  process-definition-location-prefix: classpath*:/processes/
  activity-font-name: 瀹嬩綋
  label-font-name: 瀹嬩綋
  check-process-definitions: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  api-docs:
    path: /workflow/v3/api-docs

logging:
  level:
    com.cloudhub.platform: DEBUG
    org.flowable: INFO

# ============ 澶氱鎴锋嫤鎴櫒寮€鍏?(P0-1 鍥炴粴寮€鍏? ============
# 閰嶅鏂囨。: doc/P0-1-鍥炴粴寮€鍏宠璁?md 鏂规 A
# 榛樿 true (鎷︽埅鍣ㄥ姞杞? 褰撳墠琛屼负)
# 绱ф€ュ洖婊? 璁剧疆鐜鍙橀噺 PLATFORM_TENANT_INTERCEPTOR_ENABLED=false 鍚庨噸鍚?
# 鍏抽棴鍚庢墍鏈?SQL 涓嶅啀鑷姩鎷兼帴 tenant_id 鏉′欢, 涓氬姟鍥炲埌 v3.1 涔嬪墠琛屼负
# ============ 鏁版嵁鏉冮檺鍗囩骇寮€鍏?(v7.1 PR1-4 鍏辩敤, 鍐崇瓥 3 v1.1) ============
# 閰嶅鏂囨。: doc/椤圭洰杩涘害.md v7.1 搂7.2
# 榛樿 false (璧?v7.0 琛屼负), 楠岃瘉娴佺▼閫氳繃鍚庣敤鎴锋媿鏉挎敼 true
# 绱ф€ュ洖婊? 璁剧疆鐜鍙橀噺 PLATFORM_DATA_SCOPE_UPGRADE_ENABLED=false 鍚庨噸鍚?
# 鍏抽棴鍚庤蛋 v7.0 琛屼负 (鑰?DFS 搴旂敤灞傞€掑綊, 鏃犵鎴疯繃婊?
platform:
  tenant:
    interceptor:
      enabled: ${PLATFORM_TENANT_INTERCEPTOR_ENABLED:true}
  data-scope:
    upgrade:
      enabled: ${PLATFORM_DATA_SCOPE_UPGRADE_ENABLED:false}
      # M5 P0-2 PR4: 写严格模式 (默认 false 安全降级, true 时 fail-closed)
      # false: SQL 解析失败/禁用语法 (FORCE INDEX) 记 WARN 放行, 业务可用但无 data scope
      # true:  解析失败抛 DataScopeViolationException, 阻止执行 (写操作零越权)
      # 紧急回滚: PLATFORM_DATA_SCOPE_UPGRADE_WRITE_STRICT=false 重启
      write-strict: ${PLATFORM_DATA_SCOPE_UPGRADE_WRITE_STRICT:true}

# ============ 链路追踪 (M6 P1-1) ============
management:
  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

