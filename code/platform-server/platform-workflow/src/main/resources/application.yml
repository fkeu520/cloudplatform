server:
  port: 8084

spring:
  application:
    name: platform-workflow

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        # 启动时容忍 Nacos gRPC 客户端未就绪
        fail-fast: false
      config:
        import-check:
          enabled: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: platform
    password: platform123

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: taskNotify:com.cloudhub.platform.workflow.notify.TaskNotifyMessage
        max.block.ms: 3000
        request.timeout.ms: 3000
    consumer:
      group-id: workflow-task-notify
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: taskNotify:com.cloudhub.platform.workflow.notify.TaskNotifyMessage
        spring.json.trusted.packages: com.cloudhub.platform.workflow
        max.poll.interval.ms: 5000
    topic:
      task-notify: task-notify
      workflow-message: workflow-message

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    table: flyway_schema_history_workflow

flowable:
  database-schema-update: true
  async-executor-activate: true
  process-definition-location-prefix: classpath*:/processes/
  activity-font-name: 宋体
  label-font-name: 宋体
  check-process-definitions: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  api-docs:
    path: /workflow/v3/api-docs

logging:
  level:
    com.cloudhub.platform: DEBUG
    org.flowable: INFO

# ============ 多租户拦截器开关 (P0-1 回滚开关) ============
# 配套文档: doc/P0-1-回滚开关设计.md 方案 A
# 默认 true (拦截器加载, 当前行为)
# 紧急回滚: 设置环境变量 PLATFORM_TENANT_INTERCEPTOR_ENABLED=false 后重启
# 关闭后所有 SQL 不再自动拼接 tenant_id 条件, 业务回到 v3.1 之前行为
platform:
  tenant:
    interceptor:
      enabled: ${PLATFORM_TENANT_INTERCEPTOR_ENABLED:true}
