server:
  port: 8084

spring:
  application:
    name: platform-workflow

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        import-check:
          enabled: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: platform
    password: platform123

  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: taskNotify:com.cloudhub.platform.workflow.notify.TaskNotifyMessage
        max.block.ms: 3000
        request.timeout.ms: 3000
    consumer:
      group-id: workflow-task-notify
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: taskNotify:com.cloudhub.platform.workflow.notify.TaskNotifyMessage
        spring.json.trusted.packages: "*"
        max.poll.interval.ms: 5000
    topic:
      task-notify: task-notify
      workflow-message: workflow-message

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history_workflow

flowable:
  database-schema-update: true
  async-executor-activate: true
  process-definition-location-prefix: classpath*:/processes/
  activity-font-name: 宋体
  label-font-name: 宋体
  check-process-definitions: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    path: /workflow/v3/api-docs

logging:
  level:
    com.cloudhub.platform: DEBUG
    org.flowable: INFO
