# ================================================
# 云枢中台 - 公共配置
# 共享给所有微服务
# ================================================

spring:
  # 数据库
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://platform-mysql:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: platform
    password: platform123
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis
  data:
    redis:
      host: platform-redis
      port: 6379
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# MyBatis Plus（各服务可按需覆盖）
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.cloudhub.platform.user.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（生产环境请通过环境变量 JWT_SECRET 覆盖）
jwt:
  secret: ${JWT_SECRET:cloudhub-platform-secret-key-2024-change-in-production}
  expire-time: 604800  # 7天（秒）

# ================================================
# 灰度开关 (gray-release-infrastructure PR1)
# 配置后可经 Nacos 推送生效, 各服务通过 @Value/${...} 读取
# 默认值与各服务 application.yml 一致, 本段为单一真源
# 关联: doc/log/项目进度.md §灰度基础设施
# ================================================
platform:
  # ============ M4 P0-1 多租户拦截器 (M5 决策, 默认开启) ============
  tenant:
    interceptor:
      # 总开关: false 时不装配 TenantLineInnerInterceptor Bean (MybatisPlusConfig.java:95)
      # 关闭后所有 SQL 不再自动拼接 tenant_id, 业务回到 v3.1 之前行为
      # 注意: 关闭期间任何跨租户请求都会越权, 仅限止血场景
      enabled: ${PLATFORM_TENANT_INTERCEPTOR_ENABLED:true}
  # ============ M5 P0-2 数据权限升级 (决策 3 v1.1, 默认关闭) ============
  data-scope:
    upgrade:
      # 总开关: false 走 v7.0 行为 (SELECT only + 解析失败放行 + Provider=null 退化无限制)
      #         true 走 v7.1 增强 (CTE + 8 个 @DataScope + 3 个 Provider 桩 + UPDATE/DELETE 拦截)
      # 灰度策略: 先单服务开启 (docker-compose env) → 监控 → 全量
      enabled: ${PLATFORM_DATA_SCOPE_UPGRADE_ENABLED:false}
      # 写严格模式 (PR4, 默认 true 安全降级)
      # false: SQL 解析失败/禁用语法 (FORCE INDEX) 记 WARN 放行, 业务可用但无 data scope
      # true:  解析失败抛 DataScopeViolationException, 阻止执行 (写操作零越权)
      # 紧急回滚: PLATFORM_DATA_SCOPE_UPGRADE_WRITE_STRICT=false 重启
      write-strict: ${PLATFORM_DATA_SCOPE_UPGRADE_WRITE_STRICT:true}
      # ============ gray-release-infrastructure PR5: 维度灰度 ============
      # 总开关 enabled=true 时, 控制谁真正走新逻辑. 不在范围内的仍走老逻辑 (回退路径不变)
      dimension: ${PLATFORM_DATA_SCOPE_UPGRADE_DIMENSION:all}
      # dimension=tenant 时生效, CSV 白名单 (例 "1,2,3")
      tenants: ${PLATFORM_DATA_SCOPE_UPGRADE_TENANTS:}
      # dimension=user 时生效, CSV 白名单
      users: ${PLATFORM_DATA_SCOPE_UPGRADE_USERS:}
      # dimension=percent 时生效, 0-100 灰度比例 (基于 userId hash, 同 user 始终命中同一分支)
      percent: ${PLATFORM_DATA_SCOPE_UPGRADE_PERCENT:100}

# 日志级别
logging:
  level:
    com.cloudhub.platform: DEBUG
    org.springframework.cloud.gateway: INFO