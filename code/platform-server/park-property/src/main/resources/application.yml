server:
  port: 8092
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:30}
      min-spare: ${TOMCAT_THREADS_MIN:5}
    accept-count: 50
    max-connections: 500
    connection-timeout: 20s
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  application:
    name: park-property

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_USER:platform}
    password: ${MYSQL_PASSWORD:platform123}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 2
      connection-timeout: 20000
      max-lifetime: 1800000
      idle-timeout: 600000
      pool-name: ${spring.application.name}-pool

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX:8}
          max-idle: ${REDIS_POOL_MAX:8}
          min-idle: 2
          max-wait: 2s

  config:
    import:
      - optional:nacos:common.yml

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:8848
        enabled: true
        fail-fast: false
      config:
        server-addr: ${NACOS_HOST:localhost}:8848
        enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.cloudhub.platform.property.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  snowflake:
    worker-id: ${MYBATIS_PLUS_SNOWFLAKE_WORKER_ID:6}
    datacenter-id: ${MYBATIS_PLUS_SNOWFLAKE_DATACENTER_ID:1}

springdoc:
  api-docs:
    path: /property/v3/api-docs

knife4j:
  enable: true
  setting:
    enable-swagger-models: true
    enable-footer: false

logging:
  level:
    com.cloudhub.platform: DEBUG

platform:
  tenant:
    interceptor:
      enabled: ${PLATFORM_TENANT_INTERCEPTOR_ENABLED:true}

management:
  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
