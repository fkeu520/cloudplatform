server:
  port: 8094
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:15}
      min-spare: ${TOMCAT_THREADS_MIN:2}
    accept-count: 40
    max-connections: 300
    connection-timeout: 20s
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  application:
    name: park-enterprise

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_USER:platform}
    password: ${MYSQL_PASSWORD:platform123}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:3}
      minimum-idle: 1
      connection-timeout: 20000
      max-lifetime: 1800000
      idle-timeout: 600000
      pool-name: ${spring.application.name}-pool

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX:4}
          max-idle: ${REDIS_POOL_MAX:4}
          min-idle: 1
          max-wait: 2s

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 50MB

  config:
    import:
      - optional:nacos:common.yml

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:8848
        enabled: true
        fail-fast: false
      config:
        server-addr: ${NACOS_HOST:localhost}:8848
        enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.cloudhub.platform.enterprise.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # park-enterprise worker-id=8 (park-space=5, park-property=6, park-contract=7)
  # datacenter-id=1 与 park-* 共享
  snowflake:
    worker-id: ${MYBATIS_PLUS_SNOWFLAKE_WORKER_ID:8}
    datacenter-id: ${MYBATIS_PLUS_SNOWFLAKE_DATACENTER_ID:1}

springdoc:
  api-docs:
    path: /enterprise/v3/api-docs

knife4j:
  enable: true
  setting:
    enable-swagger-models: true
    enable-footer: false

logging:
  level:
    com.cloudhub.platform: DEBUG

# ──────────────────────────────────────────────
# 云企库第三方数据集成 (Phase 3, csyh pai-enterprise 迁移)
# 注: 命名空间用 platform.cloud.* 而非 cloud.* — 顶层 cloud.* 会触发
#     Spring Cloud Common 的 CloudEnvironmentPostProcessor, 217 启动失败
#     (2026-07-01 排错: 与 MybatisPlusInterceptor 初始化竞争导致 SqlSessionFactory 缺失)
# 11 模块: Overview/BusinessRisk/BusinessSituation/EntDetail/
#           EnterpriseImage/EnterpriseRecruit/EnterpriseSearch/
#           EntRegType/JudicialRisk/Knowledge/NationalEconomy
# ──────────────────────────────────────────────
platform:
  cloud:
    enterprise:
      enabled: ${CLOUD_ENTERPRISE_ENABLED:false}
      base-uri: ${CLOUD_ENTERPRISE_BASE_URI:http://link.flyrise.cn/cloud-enterprisedb-api/v2}
      auth-uri: ${CLOUD_ENTERPRISE_AUTH_URI:http://link.flyrise.cn/auth-api/oauth/token}
      client-id: ${CLOUD_ENTERPRISE_CLIENT_ID:}
      client-secret: ${CLOUD_ENTERPRISE_CLIENT_SECRET:}
      read-timeout: 10000
  tenant:
    interceptor:
      enabled: ${PLATFORM_TENANT_INTERCEPTOR_ENABLED:true}

management:
  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
