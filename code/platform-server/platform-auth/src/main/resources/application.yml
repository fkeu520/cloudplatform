server:
  port: 8082
  address: 0.0.0.0

spring:
  main:
    web-application-type: servlet
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  application:
    name: platform-auth

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: platform
    password: platform123

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10s

  # Nacos 配置
  config:
    import:
      - optional:nacos:common.yml

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
      config:
        server-addr: localhost:8848
        enabled: false

springdoc:
  api-docs:
    path: /auth/v3/api-docs

logging:
  level:
    com.cloudhub.platform: DEBUG

# ============ 多租户拦截器开关 (P0-1 回滚开关) ============
# 配套文档: doc/P0-1-回滚开关设计.md 方案 A
# 默认 true (拦截器加载, 当前行为)
# 紧急回滚: 设置环境变量 PLATFORM_TENANT_INTERCEPTOR_ENABLED=false 后重启
# 关闭后所有 SQL 不再自动拼接 tenant_id 条件, 业务回到 v3.1 之前行为
platform:
  tenant:
    interceptor:
      enabled: ${PLATFORM_TENANT_INTERCEPTOR_ENABLED:true}