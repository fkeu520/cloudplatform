server:
  port: 8081

spring:
  application:
    name: platform-user

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: platform
    password: platform123

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  config:
    import:
      - optional:nacos:common.yml

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
        # 鍚姩鏃跺蹇?Nacos gRPC 瀹㈡埛绔湭灏辩华 (Docker Desktop 閲嶅惎鏃跺父瑙侀棶棰?
        fail-fast: false
      config:
        server-addr: localhost:8848
        enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.cloudhub.platform.user.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # 闆姳 ID 鏄惧紡閰嶇疆 (閬垮厤 MP 3.5.5 榛樿 (0,0) 瀵艰嚧澶氭湇鍔″悓闆嗙兢纰版挒)
  # 澶氭満閮ㄧ讲鏃堕€氳繃鐜鍙橀噺 MYBATIS_PLUS_SNOWFLAKE_WORKER_ID 瑕嗙洊 (0-31)
  snowflake:
    worker-id: ${MYBATIS_PLUS_SNOWFLAKE_WORKER_ID:1}
    datacenter-id: ${MYBATIS_PLUS_SNOWFLAKE_DATACENTER_ID:1}

springdoc:
  api-docs:
    path: /user/v3/api-docs

knife4j:
  enable: true
  setting:
    enable-swagger-models: true
    enable-footer: false

jwt:
  secret: cloudhub-platform-secret-key-2024
  expire-time: 604800

logging:
  level:
    com.cloudhub.platform: DEBUG
    org.springframework.cloud.gateway: DEBUG

# ============ 澶氱鎴锋嫤鎴櫒寮€鍏?(P0-1 鍥炴粴寮€鍏? ============
# 閰嶅鏂囨。: doc/P0-1-鍥炴粴寮€鍏宠璁?md 鏂规 A
# 榛樿 true (鎷︽埅鍣ㄥ姞杞? 褰撳墠琛屼负)
# 绱ф€ュ洖婊? 璁剧疆鐜鍙橀噺 PLATFORM_TENANT_INTERCEPTOR_ENABLED=false 鍚庨噸鍚?
# 鍏抽棴鍚庢墍鏈?SQL 涓嶅啀鑷姩鎷兼帴 tenant_id 鏉′欢, 涓氬姟鍥炲埌 v3.1 涔嬪墠琛屼负
# ============ 鏁版嵁鏉冮檺鍗囩骇寮€鍏?(v7.1 PR1-4 鍏辩敤, 鍐崇瓥 3 v1.1) ============
# 閰嶅鏂囨。: doc/椤圭洰杩涘害.md v7.1 搂7.2
# 榛樿 false (璧?v7.0 琛屼负), 楠岃瘉娴佺▼閫氳繃鍚庣敤鎴锋媿鏉挎敼 true
# 绱ф€ュ洖婊? 璁剧疆鐜鍙橀噺 PLATFORM_DATA_SCOPE_UPGRADE_ENABLED=false 鍚庨噸鍚?
# 鍏抽棴鍚庤蛋 v7.0 琛屼负 (鑰?DFS 搴旂敤灞傞€掑綊, 鏃犵鎴疯繃婊?
platform:
  tenant:
    interceptor:
      enabled: ${PLATFORM_TENANT_INTERCEPTOR_ENABLED:true}
  data-scope:
    upgrade:
      enabled: ${PLATFORM_DATA_SCOPE_UPGRADE_ENABLED:false}
      # M5 P0-2 PR4: 写严格模式 (默认 false 安全降级, true 时 fail-closed)
      # false: SQL 解析失败/禁用语法 (FORCE INDEX) 记 WARN 放行, 业务可用但无 data scope
      # true:  解析失败抛 DataScopeViolationException, 阻止执行 (写操作零越权)
      # 紧急回滚: PLATFORM_DATA_SCOPE_UPGRADE_WRITE_STRICT=false 重启
      write-strict: ${PLATFORM_DATA_SCOPE_UPGRADE_WRITE_STRICT:false}
