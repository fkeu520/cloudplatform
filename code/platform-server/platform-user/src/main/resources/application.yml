server:
  port: 8081

spring:
  application:
    name: platform-user

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: platform
    password: platform123

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  config:
    import:
      - optional:nacos:common.yml

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
        # 启动时容忍 Nacos gRPC 客户端未就绪 (Docker Desktop 重启时常见问题)
        fail-fast: false
      config:
        server-addr: localhost:8848
        enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.cloudhub.platform.user.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # 雪花 ID 显式配置 (避免 MP 3.5.5 默认 (0,0) 导致多服务同集群碰撞)
  # 多机部署时通过环境变量 MYBATIS_PLUS_SNOWFLAKE_WORKER_ID 覆盖 (0-31)
  snowflake:
    worker-id: ${MYBATIS_PLUS_SNOWFLAKE_WORKER_ID:1}
    datacenter-id: ${MYBATIS_PLUS_SNOWFLAKE_DATACENTER_ID:1}

springdoc:
  api-docs:
    path: /user/v3/api-docs

knife4j:
  enable: true
  setting:
    enable-swagger-models: true
    enable-footer: false

jwt:
  secret: cloudhub-platform-secret-key-2024
  expire-time: 604800

logging:
  level:
    com.cloudhub.platform: DEBUG
    org.springframework.cloud.gateway: DEBUG

# ============ 多租户拦截器开关 (P0-1 回滚开关) ============
# 配套文档: doc/P0-1-回滚开关设计.md 方案 A
# 默认 true (拦截器加载, 当前行为)
# 紧急回滚: 设置环境变量 PLATFORM_TENANT_INTERCEPTOR_ENABLED=false 后重启
# 关闭后所有 SQL 不再自动拼接 tenant_id 条件, 业务回到 v3.1 之前行为
# ============ 数据权限升级开关 (v7.1 PR1-4 共用, 决策 3 v1.1) ============
# 配套文档: doc/项目进度.md v7.1 §7.2
# 默认 false (走 v7.0 行为), 验证流程通过后用户拍板改 true
# 紧急回滚: 设置环境变量 PLATFORM_DATA_SCOPE_UPGRADE_ENABLED=false 后重启
# 关闭后走 v7.0 行为 (老 DFS 应用层递归, 无租户过滤)
platform:
  tenant:
    interceptor:
      enabled: ${PLATFORM_TENANT_INTERCEPTOR_ENABLED:true}
  data-scope:
    upgrade:
      enabled: ${PLATFORM_DATA_SCOPE_UPGRADE_ENABLED:false}