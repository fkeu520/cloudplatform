server:
  port: 8085
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:80}
      min-spare: ${TOMCAT_THREADS_MIN:10}
    accept-count: 100
    max-connections: 2000
    connection-timeout: 20s
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  application:
    name: platform-message

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/platform_message?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: platform
    password: platform123
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX:12}
          max-idle: 8
          min-idle: 0

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        spring.json.type.mapping: messageSendReq:com.cloudhub.platform.message.model.MessageSendRequest
    consumer:
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:1}
      max-poll-records: ${KAFKA_MAX_POLL:50}
      group-id: message-send-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # 2026-06-12 修复: workflow-message 跨服务 DTO 反序列化
        # 之前只信 com.cloudhub.platform.message, producer 端发 com.cloudhub.platform.workflow.notify.WorkflowMessage
        # 会被 trusted.packages 拒绝, 消息丢弃。
        # 修复: WorkflowMessage 移到 com.cloudhub.platform.common.notify (与 consumer 共用), 这里只
        # 需要把 com.cloudhub.platform.common 加进 trusted.packages 即可, 无需 type.mapping 重映射。
        # messageSendReq 仍在本服务包, type.mapping 保留。
        spring.json.type.mapping: messageSendReq:com.cloudhub.platform.message.model.MessageSendRequest
        spring.json.trusted.packages: com.cloudhub.platform.message,com.cloudhub.platform.common
    topic:
      message-send: message-send
      workflow-message: workflow-message

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
        # 鍚姩鏃跺蹇?Nacos gRPC 瀹㈡埛绔湭灏辩华
        fail-fast: false
      config:
        server-addr: localhost:8848
        enabled: false

  # L2 Phase B: 邮件发送默认关闭（EmailSender 程序化创建 MailSender, 不影响功能）
  mail:
    enabled: ${PLATFORM_MAIL_ENABLED:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history_message
    validate-on-migrate: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.cloudhub.platform.message.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # 闆姳 ID 鏄惧紡閰嶇疆 (浣跨敤鐙珛 datacenter-id 鍖哄垎涓嶅悓鏁版嵁搴?
  snowflake:
    worker-id: ${MYBATIS_PLUS_SNOWFLAKE_WORKER_ID:1}
    datacenter-id: ${MYBATIS_PLUS_SNOWFLAKE_DATACENTER_ID:2}

knife4j:
  enable: true
  setting:
    enable-swagger-models: true
    enable-footer: false

logging:
  level:
    com.cloudhub.platform: DEBUG

# ============ 澶氱鎴锋嫤鎴櫒寮€鍏?(P0-1 鍥炴粴寮€鍏? ============
# 閰嶅鏂囨。: doc/P0-1-鍥炴粴寮€鍏宠璁?md 鏂规 A
# 榛樿 true (鎷︽埅鍣ㄥ姞杞? 褰撳墠琛屼负)
# 绱ф€ュ洖婊? 璁剧疆鐜鍙橀噺 PLATFORM_TENANT_INTERCEPTOR_ENABLED=false 鍚庨噸鍚?
# 鍏抽棴鍚庢墍鏈?SQL 涓嶅啀鑷姩鎷兼帴 tenant_id 鏉′欢, 涓氬姟鍥炲埌 v3.1 涔嬪墠琛屼负
# ============ 鏁版嵁鏉冮檺鍗囩骇寮€鍏?(v7.1 PR1-4 鍏辩敤, 鍐崇瓥 3 v1.1) ============
# 閰嶅鏂囨。: doc/椤圭洰杩涘害.md v7.1 搂7.2
# 榛樿 false (璧?v7.0 琛屼负), 楠岃瘉娴佺▼閫氳繃鍚庣敤鎴锋媿鏉挎敼 true
# 绱ф€ュ洖婊? 璁剧疆鐜鍙橀噺 PLATFORM_DATA_SCOPE_UPGRADE_ENABLED=false 鍚庨噸鍚?
# 鍏抽棴鍚庤蛋 v7.0 琛屼负 (鑰?DFS 搴旂敤灞傞€掑綊, 鏃犵鎴疯繃婊?
platform:
  tenant:
    interceptor:
      enabled: ${PLATFORM_TENANT_INTERCEPTOR_ENABLED:true}
  data-scope:
    upgrade:
      enabled: ${PLATFORM_DATA_SCOPE_UPGRADE_ENABLED:false}
      # M5 P0-2 PR4: 写严格模式 (默认 false 安全降级, true 时 fail-closed)
      # false: SQL 解析失败/禁用语法 (FORCE INDEX) 记 WARN 放行, 业务可用但无 data scope
      # true:  解析失败抛 DataScopeViolationException, 阻止执行 (写操作零越权)
      # 紧急回滚: PLATFORM_DATA_SCOPE_UPGRADE_WRITE_STRICT=false 重启
      write-strict: ${PLATFORM_DATA_SCOPE_UPGRADE_WRITE_STRICT:true}

# ============ 链路追踪 (M6 P1-1) ============
management:
  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

