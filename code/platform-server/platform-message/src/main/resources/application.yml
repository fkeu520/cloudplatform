server:
  port: 8085

spring:
  application:
    name: platform-message

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/platform_message?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: platform
    password: platform123

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        spring.json.type.mapping: messageSendReq:com.cloudhub.platform.message.model.MessageSendRequest
    consumer:
      group-id: message-send-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: messageSendReq:com.cloudhub.platform.message.model.MessageSendRequest
        spring.json.trusted.packages: com.cloudhub.platform.message
    topic:
      message-send: message-send
      workflow-message: workflow-message

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
        # 启动时容忍 Nacos gRPC 客户端未就绪
        fail-fast: false
      config:
        server-addr: localhost:8848
        enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history_message
    validate-on-migrate: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.cloudhub.platform.message.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # 雪花 ID 显式配置 (使用独立 datacenter-id 区分不同数据库)
  snowflake:
    worker-id: ${MYBATIS_PLUS_SNOWFLAKE_WORKER_ID:1}
    datacenter-id: ${MYBATIS_PLUS_SNOWFLAKE_DATACENTER_ID:2}

knife4j:
  enable: true
  setting:
    enable-swagger-models: true
    enable-footer: false

logging:
  level:
    com.cloudhub.platform: DEBUG
