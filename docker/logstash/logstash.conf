# ==============================================================================
# Logstash Pipeline
# ==============================================================================
# Inputs:
#   - GELF UDP 12201: Docker container logs (logging.driver: gelf)
#   - TCP 5000:      Spring Boot direct push (可选，logstash-logback-encoder)
# ==============================================================================

input {
  # 接收 Docker 容器日志 (GELF UDP)
  # 2026-06-04 修复: 删除 codec => gelf (非 OSS 插件), gelf input 插件自动处理
  gelf {
    port => 12201
  }
  # 兼容原有 TCP JSON 输入
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # 统一时间字段
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # GELF 消息中提取容器名/服务名
  if [container_name] {
    mutate {
      add_field => {
        "service" => "%{[container_name]}"
      }
    }
  }

  # 解析 Spring Boot 日志级别 (从 message 开头)
  # 格式: 2024-01-01 12:00:00.000  INFO 12345 --- [thread] ClassName : message
  if [message] =~ /^\d{4}-\d{2}-\d{2}/ {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:log_timestamp}\s+%{LOGLEVEL:log_level}\s+\d+\s+---\s+\[[^\]]+\]\s+%{NOTSPACE:logger}\s+:\s+%{GREEDYDATA:log_message}"
      }
      tag_on_failure => ["_grokparsefailure"]
    }
    if [log_timestamp] {
      date {
        match => ["log_timestamp", "yyyy-MM-dd HH:mm:ss.SSS"]
        target => "@timestamp"
      }
    }
  }

  # 标记错误日志便于 Kibana 过滤
  if [log_level] == "ERROR" or [level_name] == "ERROR" {
    mutate {
      add_tag => ["error"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # 按天滚动索引，配合 ILM 策略实现 1 天保留
    index => "platform-logs-%{+YYYY.MM.dd}"
    data_stream => false
    # 失败重试
    retry_on_failure => true
    retry_max_interval => 10
  }
}
