  #     - targets:
  #         - 'platform-user:8081'
  #         - 'platform-gateway:8083'
  #         - 'platform-auth:8082'
  #         - 'platform-workflow:8084'
  #         - 'platform-message:8085'
  #         - 'platform-ops:8087'
