<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行业类型 - 云枢中台</title>
  <link rel="stylesheet" href="../_assets/common.css">
  <style>
    html,body{height:100%;overflow:hidden}
    body{display:flex;flex-direction:column}
    .page-content{flex:1;overflow-y:auto;padding:16px 24px 24px}

    /* ─── Layout ─── */
    .layout{display:flex;gap:20px;height:calc(100vh - 140px);min-height:500px}
    .left-panel{width:280px;flex-shrink:0;background:var(--color-canvas);border-radius:12px;border:1px solid var(--color-divider);display:flex;flex-direction:column;overflow:hidden}
    .right-panel{flex:1;background:var(--color-canvas);border-radius:12px;border:1px solid var(--color-divider);overflow:hidden;display:flex;flex-direction:column}

    /* ─── Left Panel - Tree ─── */
    .panel-header{padding:16px 16px 12px;border-bottom:1px solid var(--color-divider);display:flex;justify-content:space-between;align-items:center}
    .panel-header h3{font-size:14px;font-weight:600}
    .panel-body{flex:1;overflow-y:auto;padding:8px 0}
    .tree-node{display:flex;align-items:center;gap:6px;padding:7px 16px;cursor:pointer;font-size:13px;color:var(--color-ink);transition:all .15s;border-left:3px solid transparent;width:100%;position:relative}
    .tree-node:hover{background:var(--color-primary-pale)}
    .tree-node.active{background:var(--color-primary-pale);border-left-color:var(--color-primary);font-weight:600}
    .tree-node .toggle{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--color-ink-tertiary);cursor:pointer;flex-shrink:0;transition:transform .2s}
    .tree-node .toggle.expanded{transform:rotate(90deg)}
    .tree-node .toggle.empty{visibility:hidden}
    .tree-node .icon{font-size:14px;flex-shrink:0}
    .tree-node .count{font-size:11px;color:var(--color-ink-tertiary);margin-left:auto}
    .tree-children{padding-left:24px;position:relative}
    .tree-children::before{content:'';position:absolute;left:11px;top:0;bottom:0;width:1px;background:var(--color-divider)}
    .tree-children .tree-node{font-size:12px;padding:6px 16px 6px 12px}

    /* ─── Right Panel - Content ─── */
    .right-panel .panel-body{padding:20px 24px;overflow-y:auto}
    .section-title{font-size:15px;font-weight:600;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--color-divider)}
    .sub-section-title{font-size:13px;font-weight:600;color:var(--color-ink-secondary);margin:16px 0 8px}

    /* ─── Industry Info Card ─── */
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .info-item .label{font-size:12px;color:var(--color-ink-tertiary);margin-bottom:2px}
    .info-item .value{font-size:14px;color:var(--color-ink);font-weight:500}

    /* ─── Stats Row ─── */
    .stats-row{display:flex;gap:12px;margin-bottom:16px}
    .stat-mini{flex:1;background:var(--color-canvas-elevated);border-radius:8px;padding:12px 16px;text-align:center;border:1px solid var(--color-divider)}
    .stat-mini .num{font-size:20px;font-weight:700;color:var(--color-primary)}
    .stat-mini .lbl{font-size:11px;color:var(--color-ink-tertiary);margin-top:2px}

    /* ─── Sub-Industry Table ─── */
    .sub-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
    .sub-table th{text-align:left;padding:8px 12px;background:var(--color-canvas-grouped);font-weight:600;color:var(--color-ink-secondary);font-size:12px;border-bottom:1px solid var(--color-divider)}
    .sub-table td{padding:8px 12px;border-bottom:1px solid var(--color-divider)}

    .btn{padding:8px 20px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .2s;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
    .btn-primary{background:var(--color-primary);color:#fff}
    .btn-primary:hover{background:var(--color-primary-active)}
    .btn-default{background:var(--color-canvas);color:var(--color-ink);border:1px solid var(--color-divider)}
    .btn-default:hover{background:var(--color-canvas-grouped)}
    .btn-danger{background:var(--color-negative);color:#fff}
    .btn-danger:hover{background:#d32f2f}
    .btn-sm{padding:5px 12px;font-size:12px}
    .btn-icon{width:28px;height:28px;border-radius:6px;border:1px solid var(--color-divider);background:var(--color-canvas);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--color-ink-secondary);transition:all .15s}
    .btn-icon:hover{background:var(--color-canvas-grouped);border-color:var(--color-primary);color:var(--color-primary)}

    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
    .search-box{display:flex;gap:8px;align-items:center}
    .search-box input{padding:6px 12px;border:1px solid var(--color-divider);border-radius:8px;font-size:13px;font-family:inherit;width:200px}
    .search-box input:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-pale)}
    .badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
    .badge-active{background:#E8F5E9;color:#2E7D32}
    .badge-inactive{background:#f5f5f5;color:#999}

    .empty-state{text-align:center;padding:60px 20px;color:var(--color-ink-tertiary)}
    .empty-state .icon{font-size:48px;margin-bottom:12px;opacity:0.4}
    .empty-state .text{font-size:14px}

    .modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:9999;align-items:center;justify-content:center}
    .modal-overlay.show{display:flex}
    .modal{background:var(--color-canvas);border-radius:16px;width:520px;max-height:80vh;overflow:hidden;box-shadow:var(--shadow-elevated)}
    .modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0}
    .modal-header h3{font-size:18px;font-weight:600}
    .modal-header .close{width:32px;height:32px;border-radius:50%;border:none;background:var(--color-canvas-grouped);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--color-ink-secondary)}
    .modal-body{padding:16px 24px 20px;overflow-y:auto;max-height:calc(80vh - 80px)}
    .modal-footer{display:flex;justify-content:flex-end;gap:12px;padding:16px 24px;border-top:1px solid var(--color-divider)}
    .form-row{display:flex;gap:16px;margin-bottom:14px}
    .form-row .col{flex:1;min-width:0}
    .form-row label{display:block;font-size:12px;font-weight:500;color:var(--color-ink-secondary);margin-bottom:4px}
    .form-row label .required{color:var(--color-negative);margin-left:2px}
    input[type="text"],input[type="number"],select{width:100%;padding:8px 12px;border:1px solid var(--color-divider);border-radius:8px;font-size:13px;font-family:inherit;background:var(--color-canvas);color:var(--color-ink)}
    input:focus,select:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-pale)}
    textarea{width:100%;padding:8px 12px;border:1px solid var(--color-divider);border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:60px}
    textarea:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-pale)}
  </style>
</head>
<body>
<div class="page-content">

  <div style="font-size:12px;color:var(--color-ink-tertiary);margin-bottom:4px">企业档案 &gt; 行业类型</div>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
    <div>
      <h2 style="font-size:22px;font-weight:700">行业类型</h2>
      <p style="font-size:13px;color:var(--color-ink-secondary);margin-top:2px">管理行业分类体系，支持多级行业结构</p>
    </div>
    <button class="btn btn-primary" onclick="showModal('addMajor')">+ 新增大类</button>
  </div>

  <!-- ═══ Left-Right Layout ═══ -->
  <div class="layout">

    <!-- Left: Industry Tree -->
    <div class="left-panel">
      <div class="panel-header">
        <h3>📂 行业分类</h3>
        <button class="btn-icon" onclick="alert('刷新行业分类树')" title="刷新">🔄</button>
      </div>
      <div class="panel-body" id="treePanel"></div>
    </div>

    <!-- Right: Industry Detail (dynamic) -->
    <div class="right-panel">
      <div id="rightPanelContent"></div>
    </div>
  </div>
</div>

<!-- ═══ Modal: Add/Edit Major Industry ═══ -->
<div class="modal-overlay" id="modalAddMajor">
  <div class="modal">
    <div class="modal-header">
      <h3>新增大类</h3>
      <button class="close" onclick="hideModal('addMajor')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="col"><label>行业名称 <span class="required">*</span></label><input type="text" placeholder="如：信息技术"></div>
        <div class="col"><label>行业编码 <span class="required">*</span></label><input type="text" placeholder="如：I-65"></div>
      </div>
      <div class="form-row">
        <div class="col"><label>排序号</label><input type="number" value="0"></div>
        <div class="col"><label>状态</label>
          <select><option selected>启用</option><option>禁用</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="col"><label>描述</label><textarea placeholder="行业分类描述"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="hideModal('addMajor')">取消</button>
      <button class="btn btn-primary" onclick="alert('行业大类已添加 ✓');hideModal('addMajor')">保存</button>
    </div>
  </div>
</div>

<!-- ═══ Modal: Edit Major Industry ═══ -->
<div class="modal-overlay" id="modalEditMajor">
  <div class="modal">
    <div class="modal-header">
      <h3>编辑行业大类</h3>
      <button class="close" onclick="hideModal('editMajor')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="col"><label>行业名称 <span class="required">*</span></label><input type="text" value="信息技术"></div>
        <div class="col"><label>行业编码 <span class="required">*</span></label><input type="text" value="I-65"></div>
      </div>
      <div class="form-row">
        <div class="col"><label>排序号</label><input type="number" value="8"></div>
        <div class="col"><label>状态</label>
          <select><option selected>启用</option><option>禁用</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="col"><label>描述</label><textarea>信息技术相关行业，包括软件开发、互联网服务、人工智能等</textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="hideModal('editMajor')">取消</button>
      <button class="btn btn-primary" onclick="alert('行业大类已更新 ✓');hideModal('editMajor')">保存</button>
    </div>
  </div>
</div>

<!-- ═══ Modal: Add Sub-Industry ═══ -->
<div class="modal-overlay" id="modalAddSub">
  <div class="modal">
    <div class="modal-header">
      <h3>新增子分类</h3>
      <button class="close" onclick="hideModal('addSub')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="col"><label>上级分类</label><input type="text" value="信息技术" disabled></div>
        <div class="col"><label>行业名称 <span class="required">*</span></label><input type="text" placeholder="如：云计算"></div>
      </div>
      <div class="form-row">
        <div class="col"><label>行业编码 <span class="required">*</span></label><input type="text" placeholder="如：I-65-04"></div>
        <div class="col"><label>排序号</label><input type="number" value="0"></div>
      </div>
      <div class="form-row">
        <div class="col"><label>状态</label>
          <select><option selected>启用</option><option>禁用</option></select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="hideModal('addSub')">取消</button>
      <button class="btn btn-primary" onclick="alert('子分类已添加 ✓');hideModal('addSub')">保存</button>
    </div>
  </div>
</div>

<!-- ═══ Modal: Edit Sub-Industry ═══ -->
<div class="modal-overlay" id="modalEditSub">

    <div class="modal-header">
      <h3>编辑子分类</h3>
      <button class="close" onclick="hideModal('editSub')">×</button>

    <div class="modal-body">
      <div class="form-row">
        <div class="col"><label>上级分类</label><input type="text" value="信息技术" disabled></div>
        <div class="col"><label>行业名称 <span class="required">*</span></label><input type="text" value="软件开发"></div>

      <div class="form-row">
        <div class="col"><label>行业编码 <span class="required">*</span></label><input type="text" value="I-65-01"></div>
        <div class="col"><label>排序号</label><input type="number" value="1"></div>
      </div>
      <div class="form-row">
        <div class="col"><label>状态</label>
          <select><option selected>启用</option><option>禁用</option></select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="hideModal('editSub')">取消</button>
      <button class="btn btn-primary" onclick="alert('子分类已更新 ✓');hideModal('editSub')">保存</button>
    </div>
  </div>
</div>

    28: [{name:'智慧农业',code:'I-55-01',enterpriseCount:12,sort:1,status:'启用'},{name:'畜牧养殖',code:'I-55-02',enterpriseCount:0,sort:2,status:'禁用'}],
    31: [{name:'影视制作',code:'I-60-01',enterpriseCount:15,sort:1,status:'启用'},{name:'广告营销',code:'I-60-02',enterpriseCount:0,sort:2,status:'禁用'}],
    34: [{name:'零售批发',code:'I-45-01',enterpriseCount:27,sort:1,status:'启用'},{name:'进出口贸易',code:'I-45-02',enterpriseCount:0,sort:2,status:'禁用'}]
  };

  function getIndustry(id) {
    return INDUSTRY_DATA.find(d => d.id === id);
  }

  function renderRightPanel(id) {
    var data = getIndustry(id);
    if (!data) {
      data = { icon:'🏭', name:'全部分类', code:'—', parent:'—', sort:0, status:'启用', childCount:12 };
    }
    var isMajor = data.parent === '—' && data.id !== 0;
    var isLeaf = !data.children || data.children.length === 0;

    // 统计数据
    var subs = SUB_MOCK[id] || [];
    var totalEnterprise = subs.reduce(function(sum, s) { return sum + s.enterpriseCount; }, 0);
    var subCount = subs.length;

    var html = '<div class="panel-header">';
    html += '<h3>' + data.icon + ' ' + data.name + '</h3>';
    html += '<div style="display:flex;gap:6px">';
    if (isMajor || data.id === 0) {
      // 顶级分类 或 全部分类
    } else {
      html += '<button class="btn btn-default btn-sm" onclick="showModal(\'editMajor\')">✏️ 编辑</button>';
      if (!isLeaf) html += '<button class="btn btn-default btn-sm" onclick="showModal(\'addSub\')">+ 新增子类</button>';
      html += '<button class="btn btn-danger btn-sm" onclick="if(confirm(\'确认删除？\'))alert(\'已删除\')">🗑️ 删除</button>';
    }
    html += '</div></div>';

    html += '<div class="panel-body">';

    if (data.id === 0) {
      // 全部分类 - 显示概览
      html += '<div class="stats-row">';
      html += '<div class="stat-mini"><div class="num">' + INDUSTRY_DATA.length + '</div><div class="lbl">行业大类</div></div>';
      html += '<div class="stat-mini"><div class="num">582</div><div class="lbl">关联企业</div></div>';
      html += '<div class="stat-mini"><div class="num">' + Object.keys(SUB_MOCK).length + '</div><div class="lbl">含子类分类</div></div>';
      html += '<div class="stat-mini"><div class="num" style="color:var(--color-positive)">●</div><div class="lbl">系统运行中</div></div>';
      html += '</div>';
      html += '<div class="section-title">行业分类概览</div>';
      html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">';
      for (var i = 1; i < INDUSTRY_DATA.length; i++) {
        if (INDUSTRY_DATA[i].parent === '—') {
          var s = SUB_MOCK[INDUSTRY_DATA[i].id] || [];
          html += '<div style="background:var(--color-canvas-elevated);border-radius:8px;padding:12px 16px;border:1px solid var(--color-divider);display:flex;align-items:center;gap:10px">';
          html += '<span style="font-size:18px">' + INDUSTRY_DATA[i].icon + '</span>';
          html += '<div><div style="font-size:13px;font-weight:500">' + INDUSTRY_DATA[i].name + '</div>';
          html += '<div style="font-size:11px;color:var(--color-ink-tertiary)">' + s.length + ' 子类 · ' + s.reduce(function(a,b){return a+b.enterpriseCount;},0) + ' 企业</div></div></div>';
        }
      }
      html += '</div>';
    } else {
      // 单个行业
      html += '<div class="stats-row">';
      html += '<div class="stat-mini"><div class="num">' + subCount + '</div><div class="lbl">子分类</div></div>';
      html += '<div class="stat-mini"><div class="num">' + totalEnterprise + '</div><div class="lbl">关联企业</div></div>';
      html += '<div class="stat-mini"><div class="num">' + (data.sort < 10 ? '0' : '') + data.sort + '</div><div class="lbl">排序</div></div>';
      html += '<div class="stat-mini"><div class="num" style="color:' + (data.status === '启用' ? 'var(--color-positive)' : 'var(--color-gray-3)') + '">●</div><div class="lbl">' + data.status + '</div></div>';
      html += '</div>';

      html += '<div class="section-title">基本信息</div>';
      html += '<div class="info-grid">';
      html += '<div class="info-item"><div class="label">行业编码</div><div class="value">' + data.code + '</div></div>';
      html += '<div class="info-item"><div class="label">行业名称</div><div class="value">' + data.name + '</div></div>';
      html += '<div class="info-item"><div class="label">上级分类</div><div class="value">' + data.parent + '</div></div>';
      html += '<div class="info-item"><div class="label">排序号</div><div class="value">' + data.sort + '</div></div>';
      html += '<div class="info-item"><div class="label">状态</div><div class="value"><span class="badge ' + (data.status === '启用' ? 'badge-active' : 'badge-inactive') + '">' + data.status + '</span></div></div>';
      html += '<div class="info-item"><div class="label">创建时间</div><div class="value">2024-01-15 10:00:00</div></div>';
      html += '</div>';

      if (subs.length > 0) {
        html += '<div class="sub-section-title">子分类列表</div>';
        html += '<table class="sub-table"><thead><tr><th style="width:40px">#</th><th>行业名称</th><th>编码</th><th>关联企业</th><th>排序</th><th>状态</th><th style="width:120px">操作</th></tr></thead><tbody>';
        for (var j = 0; j < subs.length; j++) {
          var s = subs[j];
          html += '<tr><td>' + (j+1) + '</td><td>' + s.name + '</td><td>' + s.code + '</td><td>' + s.enterpriseCount + '</td><td>' + s.sort + '</td>';
          html += '<td><span class="badge ' + (s.status === '启用' ? 'badge-active' : 'badge-inactive') + '">' + s.status + '</span></td>';
          html += '<td><button class="btn-icon" onclick="showModal(\'editSub\')" title="编辑">✏️</button>';
          html += '<button class="btn-icon" onclick="alert(\'状态已切换\')" title="切换">' + (s.status === '启用' ? '⏸️' : '▶️') + '</button>';
          html += '<button class="btn-icon" style="color:var(--color-negative)" onclick="if(confirm(\'确认删除？\'))alert(\'已删除\')" title="删除">🗑️</button></td></tr>';
        }
        html += '</tbody></table>';
      } else {
        html += '<div class="empty-state"><div class="icon">📂</div><div class="text">暂无子分类</div></div>';
      }
    }

    html += '</div>';
    document.getElementById('rightPanelContent').innerHTML = html;
  }

  function selectIndustry(id, el) {
    document.querySelectorAll('.tree-node').forEach(function(n) { n.classList.remove('active'); });
    if (el) el.classList.add('active');
    renderRightPanel(parseInt(id));
  }

  // 树形渲染
  function renderTree() {
    function buildNode(node, depth) {
      var hasChildren = node.children && node.children.length > 0;
      var id = node.id;
      var indent = depth === 0 ? '' : '';
      var html = '<div class="tree-node' + (depth === 0 && id === 0 ? ' active' : '') + '" data-industry="' + id + '" onclick="selectIndustry(' + id + ',this)">';
      if (hasChildren) {
        html += '<span class="toggle' + (depth === 0 ? ' expanded' : '') + '" onclick="event.stopPropagation();toggleTree(this)">▶</span>';
      } else {
        html += '<span class="toggle empty">▶</span>';
      }
      html += '<span class="icon">' + node.icon + '</span> ' + node.name;
      html += '</div>';
      if (hasChildren) {
        html += '<div class="tree-children" style="' + (depth === 0 ? '' : 'display:none') + '">';
        for (var i = 0; i < node.children.length; i++) {
          html += buildNode(node.children[i], depth + 1);
        }
        html += '</div>';
      }
      return html;
    }

    var root = {
      id: 0, icon: '🏭', name: '全部分类', children: []
    };
    for (var i = 1; i < INDUSTRY_DATA.length; i++) {
      if (INDUSTRY_DATA[i].parent === '—') {
        root.children.push(INDUSTRY_DATA[i]);
      }
    }
    document.getElementById('treePanel').innerHTML = buildNode(root, 0);
  }

  // 树形展开/折叠
  function toggleTree(toggle) {
    var children = toggle.parentElement.nextElementSibling;
    while (children && !children.classList.contains('tree-children')) {
      children = children.nextElementSibling;
    }
    if (children) {
      var isHidden = children.style.display === 'none';
      children.style.display = isHidden ? '' : 'none';
      toggle.classList.toggle('expanded', isHidden);
    }
  }

  // 初始渲染
  renderTree();
  renderRightPanel(0);

  function showModal(name) {
    document.getElementById('modal' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('show');
  }

  function hideModal(name) {
    document.getElementById('modal' + name.charAt(0).toUpperCase() + name.slice(1)).classList.remove('show');
  }
</script>
</body>
</html>
