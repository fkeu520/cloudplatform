<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录 - 智慧园区管理平台</title>
<style>
:root {
  --primary: #007AFF;
  --bg-dark: #1C1C1E;
  --text: #F5F5F7;
  --secondary: #8E8E93;
  --card-bg: rgba(255,255,255,0.12);
  --border: rgba(255,255,255,0.15);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0d1b2a 100%);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}
/* Animated background */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: 
    radial-gradient(ellipse at 20% 80%, rgba(0,122,255,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(88,86,214,0.2) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(0,122,255,0.05) 0%, transparent 70%);
  pointer-events: none;
}
.page-wrap {
  width: 100%;
  max-width: 430px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 0 24px;
  position: relative;
  z-index: 1;
}
/* Status Bar */
.status-bar {
  height: 47px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 8px;
  font-size: 14px;
  font-weight: 600;
  color: rgba(255,255,255,0.6);
}
/* Logo Area */
.logo-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 0;
}
.logo-icon {
  width: 72px;
  height: 72px;
  border-radius: 20px;
  background: linear-gradient(135deg, #007AFF, #5856D6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  margin-bottom: 20px;
  box-shadow: 0 8px 32px rgba(0,122,255,0.4);
}
.logo-title {
  font-size: 24px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.5px;
}
.logo-sub {
  font-size: 13px;
  color: var(--secondary);
  margin-top: 6px;
  letter-spacing: 1px;
}
/* Login Form */
.login-form {
  padding-bottom: 40px;
}
.form-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.input-group {
  margin-bottom: 16px;
}
.input-label {
  font-size: 13px;
  color: var(--secondary);
  margin-bottom: 8px;
  display: block;
}
.input-field {
  width: 100%;
  height: 48px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.08);
  padding: 0 14px;
  font-size: 16px;
  color: #fff;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}
.input-field:focus {
  border-color: var(--primary);
  background: rgba(255,255,255,0.12);
}
.input-field::placeholder { color: rgba(255,255,255,0.3); }
.input-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.forgot-link {
  font-size: 13px;
  color: var(--primary);
  text-decoration: none;
  cursor: pointer;
}
.forgot-link:active { opacity: 0.7; }
.login-btn {
  width: 100%;
  height: 50px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #007AFF, #5856D6);
  color: #fff;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  transition: opacity 0.2s, transform 0.15s;
  -webkit-appearance: none;
}
.login-btn:active { opacity: 0.85; transform: scale(0.98); }
.login-hint {
  text-align: center;
  margin-top: 16px;
  font-size: 12px;
  color: var(--secondary);
  line-height: 1.6;
}
.login-hint span { color: var(--primary); }
.error-msg {
  color: #FF6B6B;
  font-size: 12px;
  margin-top: 6px;
  display: none;
}
.error-msg.show { display: block; }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="status-bar">
    <span id="statusTime">9:41</span>
  </div>

  <div class="logo-area">
    <div class="logo-icon">🏢</div>
    <div class="logo-title">智慧园区管理平台</div>
    <div class="logo-sub">SMART PARK MANAGEMENT</div>
  </div>

  <div class="login-form">
    <div class="form-card">
      <div class="input-group">
        <div class="input-label">用户名</div>
        <input type="text" class="input-field" id="username" placeholder="请输入用户名" value="admin">
      </div>
      <div class="input-group">
        <div class="input-label">密码</div>
        <input type="password" class="input-field" id="password" placeholder="请输入密码" value="123456">
        <div class="error-msg" id="errorMsg">用户名或密码错误</div>
      </div>
      <button class="login-btn" onclick="doLogin()">登 录</button>
    </div>
    <div class="login-hint">
      演示账号：<span>admin</span> / <span>123456</span>
    </div>
  </div>
</div>

<script>
// If already logged in, redirect
(function(){
  const token = localStorage.getItem('mo_token');
  if (token) window.location.href = 'index_mo.html';
})();

function updateClock() {
  const now = new Date();
  const h = now.getHours().toString().padStart(2,'0');
  const m = now.getMinutes().toString().padStart(2,'0');
  document.getElementById('statusTime').textContent = `${h}:${m}`;
}
setInterval(updateClock, 1000);
updateClock();

function doLogin() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const err = document.getElementById('errorMsg');

  if (!u || !p) {
    err.textContent = '请输入用户名和密码';
    err.classList.add('show');
    return;
  }

  // Simulate auth check (demo only)
  if (u === 'admin' && p === '123456') {
    localStorage.setItem('mo_token', 'demo_token_' + Date.now());
    localStorage.setItem('mo_user', JSON.stringify({ name: '张三', dept: '物业管理部', role: '主管' }));
    err.classList.remove('show');
    window.location.href = 'index_mo.html';
  } else {
    err.textContent = '用户名或密码错误';
    err.classList.add('show');
  }
}

// Enter key to login
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
