<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>待办任务 - 智慧园区管理平台</title>
<style>
:root{--bg:#F5F5F7;--primary:#007AFF;--secondary:#8E8E93;--success:#34C759;--warning:#FF9500;--danger:#FF3B30;--card:#FFFFFF;--border:#E5E5E5;--text:#1C1C1E;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.page{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:70px;}
.status-bar{height:47px;background:var(--card);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:14px;font-weight:600;}
.header{height:50px;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:17px;font-weight:600;border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:10;}
.back-btn{color:var(--primary);font-size:15px;cursor:pointer;padding:8px 0;}
.content{flex:1;overflow-y:auto;}
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:430px;max-width:100%;height:60px;background:var(--card);border-top:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-around;z-index:100;}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 20px;color:var(--secondary);transition:color 0.2s;}
.tab-item.active{color:var(--primary);}
.tab-label{font-size:10px;margin-top:1px;}
.tab-switcher{display:flex;padding:12px 16px;gap:8px;background:var(--card);}
.tab-switch{padding:7px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;background:#F2F2F7;color:var(--secondary);border:1px solid transparent;transition:all 0.2s;}
.tab-switch.active{background:var(--primary);color:#fff;}
.todo-card{background:var(--card);border-radius:12px;margin:8px 16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);cursor:pointer;transition:transform 0.15s;}
.todo-card:active{transform:scale(0.98);}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.card-type{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;}
.type-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;}
.badge-warning{background:#FEF3E2;color:#FF9500;}
.badge-success{background:#E8F8EF;color:#34C759;}
.badge-danger{background:#FDECEA;color:#FF3B30;}
.badge-primary{background:#E8F2FC;color:#007AFF;}
.card-info{display:flex;flex-direction:column;gap:6px;}
.info-row{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--secondary);}
.info-row span:first-child{min-width:50px;}
.info-row span:last-child{color:var(--text);}
.card-footer{margin-top:12px;padding-top:12px;border-top:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.time{font-size:12px;color:var(--secondary);}
.action-btn{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;}
.action-btn-primary{background:var(--primary);color:#fff;}
.action-btn-outline{background:transparent;border:1px solid var(--primary);color:var(--primary);}
.empty-state{text-align:center;padding:80px 20px;color:var(--secondary);}
.empty-icon{font-size:56px;margin-bottom:12px;opacity:0.5;}
.empty-text{font-size:14px;}
</style>
</head>
<body>

  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">

    </div>
    <div class="tab-item active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>

</div>

function switchTab(el, tab) {
