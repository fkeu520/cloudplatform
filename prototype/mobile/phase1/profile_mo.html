<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>个人中心 - 智慧园区管理平台</title>
<style>
:root{--bg:#F5F5F7;--primary:#007AFF;--secondary:#8E8E93;--success:#34C759;--warning:#FF9500;--danger:#FF3B30;--card:#FFFFFF;--border:#E5E5E5;--text:#1C1C1E;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.page{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:70px;}
.status-bar{height:47px;background:var(--card);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:14px;font-weight:600;}
.header{height:50px;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:17px;font-weight:600;border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:10;}
.back-btn{color:var(--primary);font-size:15px;cursor:pointer;padding:8px 0;}
.content{flex:1;overflow-y:auto;}
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:430px;max-width:100%;height:60px;background:var(--card);border-top:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-around;z-index:100;}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 20px;color:var(--secondary);transition:color 0.2s;}
.tab-item.active{color:var(--primary);}
.tab-label{font-size:10px;margin-top:1px;}
.avatar-card{display:flex;align-items:center;gap:16px;padding:24px 16px;background:var(--card);margin:12px 16px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:600;flex-shrink:0;}
.user-info{flex:1;}
.user-name{font-size:20px;font-weight:700;}
.user-dept{font-size:13px;color:var(--secondary);margin-top:4px;}
.user-role{display:inline-block;padding:3px 10px;background:#E8F2FC;color:var(--primary);border-radius:20px;font-size:12px;font-weight:500;margin-top:8px;}
.menu-card{background:var(--card);border-radius:12px;margin:8px 16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.menu-item{display:flex;align-items:center;padding:15px 16px;border-bottom:0.5px solid var(--border);cursor:pointer;transition:background 0.15s;}
.menu-item:last-child{border-bottom:none;}
.menu-item:active{background:#F2F2F7;}
.menu-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-right:12px;flex-shrink:0;}
.menu-text{flex:1;font-size:15px;font-weight:500;}
.menu-arrow{color:var(--secondary);font-size:20px;margin-left:8px;}
.logout-btn{width:calc(100% - 32px);margin:20px 16px 0;height:48px;border-radius:12px;background:var(--card);border:1px solid #FF3B30;color:#FF3B30;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.logout-btn:active{background:#FFF5F5;}
</style>
</head>
<body>
<div class="page">
  <div class="status-bar"><span id="statusTime">9:41</span></div>
  <div class="header">
    <div class="back-btn" onclick="history.back()">‹ 返回</div>
    <span>个人中心</span>
    <div style="width:50px"></div>
  </div>

  <div class="content">
    <div class="avatar-card">
      <div class="avatar">张</div>
      <div class="user-info">
        <div class="user-name">张三</div>
        <div class="user-dept">物业管理部 · 主管</div>
        <div class="user-role">园区管理员</div>
      </div>
    </div>

    <div class="menu-card">
      <div class="menu-item" onclick="alert('个人资料')">
        <div class="menu-icon" style="background:#E8F2FC">👤</div>
        <div class="menu-text">个人资料</div>
        <div class="menu-arrow">›</div>
      </div>
      <div class="menu-item" onclick="alert('修改密码')">
        <div class="menu-icon" style="background:#FEF3E2">🔐</div>
        <div class="menu-text">修改密码</div>
        <div class="menu-arrow">›</div>
      </div>
      <div class="menu-item" onclick="alert('通知设置')">
        <div class="menu-icon" style="background:#E8F8EF">🔔</div>
        <div class="menu-text">通知设置</div>
        <div class="menu-arrow">›</div>
      </div>
      <div class="menu-item" onclick="alert('清除缓存')">
        <div class="menu-icon" style="background:#F3E8FF">🗑️</div>
        <div class="menu-text">清除缓存</div>
        <div class="menu-arrow">›</div>
      </div>
    </div>

    <div class="menu-card">
      <div class="menu-item" onclick="alert('关于系统')">
        <div class="menu-icon" style="background:#F2F2F7">ℹ️</div>
        <div class="menu-text">关于系统</div>
        <div class="menu-arrow">›</div>
      </div>
      <div class="menu-item" onclick="alert('帮助与反馈')">
        <div class="menu-icon" style="background:#FEE2E2">💬</div>
        <div class="menu-text">帮助与反馈</div>
        <div class="menu-arrow">›</div>
      </div>
    </div>

    <button class="logout-btn" onclick="logout()">退出登录</button>
    <div style="text-align:center;color:var(--secondary);font-size:12px;padding:12px 0;">智慧园区管理平台 v1.0.0</div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <div class="tab-item" onclick="location.href='home_mo.html'">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span class="tab-label">首页</span>
    </div>
    <div class="tab-item" onclick="location.href='message_mo.html'">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
      <span class="tab-label">消息</span>
    </div>
    <div class="tab-item active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span class="tab-label">我的</span>
    </div>
  </div>
</div>
<script>
(function(){
  const token = localStorage.getItem('mo_token');
  if (!token) location.href = '../login_mo.html';
})();
function updateClock(){
  const now=new Date();
  document.getElementById('statusTime').textContent=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
}
setInterval(updateClock,1000);updateClock();

function logout() {
  localStorage.removeItem('mo_token');
  localStorage.removeItem('mo_user');
  location.href = '../login_mo.html';
}
</script>
</body>
</html>
