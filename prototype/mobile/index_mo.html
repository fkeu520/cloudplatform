<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智慧园区管理平台</title>
<style>
:root {
  --bg: #F5F5F7;
  --primary: #007AFF;
  --secondary: #8E8E93;
  --success: #34C759;
  --warning: #FF9500;
  --danger: #FF3B30;
  --card-bg: #FFFFFF;
  --border: #E5E5E5;
  --text: #1C1C1E;
  --text-secondary: #8E8E93;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
.page-wrap {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
/* Status Bar */
.status-bar {
  height: 47px;
  background: var(--card-bg);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 8px;
  font-size: 14px;
  font-weight: 600;
}
.status-bar.dark { background: #1C1C1E; color: #fff; }

/* Header */
.header {
  height: 50px;
  background: var(--card-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-weight: 600;
  border-bottom: 0.5px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}
.header .back-btn {
  position: absolute;
  left: 16px;
  color: var(--primary);
  font-size: 15px;
  cursor: pointer;
}

/* Content */
.content {
  flex: 1;
  overflow-y: auto;
  padding-bottom: 80px;
}

/* Bottom Tab Bar */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 430px;
  max-width: 100%;
  height: 60px;
  background: var(--card-bg);
  border-top: 0.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 100;
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  padding: 6px 20px;
  color: var(--secondary);
  transition: color 0.2s;
}
.tab-item.active { color: var(--primary); }
.tab-item .tab-icon {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.tab-item .tab-label { font-size: 10px; margin-top: 1px; }
.tab-item.active .tab-icon svg { fill: var(--primary); }

/* Page Container */
.page { display: none; height: 100%; flex-direction: column; }
.page.active { display: flex; }

/* Cards */
.card {
  background: var(--card-bg);
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  margin: 12px 16px;
  padding: 16px;
}
.card-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-title .more {
  font-size: 13px;
  color: var(--secondary);
}

/* Section */
.section { margin: 16px 0; }
.section-title {
  font-size: 13px;
  color: var(--secondary);
  padding: 0 16px;
  margin-bottom: 8px;
  font-weight: 500;
}

/* Grid */
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 0 16px;
}
.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 0 16px;
}
.grid-item {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  transition: transform 0.15s;
}
.grid-item:active { transform: scale(0.97); }
.grid-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.grid-label { font-size: 12px; color: var(--text); font-weight: 500; }
.grid-sub { font-size: 11px; color: var(--secondary); }

/* Stat Cards */
.stat-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 0 16px;
}
.stat-card {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 14px 10px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.stat-num {
  font-size: 22px;
  font-weight: 700;
  color: var(--primary);
}
.stat-label { font-size: 11px; color: var(--secondary); margin-top: 4px; }

/* Timeline */
.timeline { padding: 0 16px; }
.timeline-item {
  display: flex;
  gap: 12px;
  padding: 12px 0;
  position: relative;
}
.timeline-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--primary);
  margin-top: 5px;
  flex-shrink: 0;
}
.timeline-content { flex: 1; }
.timeline-title { font-size: 14px; font-weight: 500; }
.timeline-time { font-size: 12px; color: var(--secondary); margin-top: 2px; }

/* List */
.list-item {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  background: var(--card-bg);
  border-bottom: 0.5px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}
.list-item:last-child { border-bottom: none; }
.list-item:active { background: #F2F2F7; }
.list-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  margin-right: 12px;
  flex-shrink: 0;
}
.list-body { flex: 1; min-width: 0; }
.list-title { font-size: 15px; font-weight: 500; }
.list-sub { font-size: 12px; color: var(--secondary); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-arrow { color: var(--secondary); font-size: 14px; margin-left: 8px; }

/* Badge */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
}
.badge-primary { background: #E8F2FC; color: var(--primary); }
.badge-success { background: #E8F8EF; color: var(--success); }
.badge-warning { background: #FEF3E2; color: var(--warning); }
.badge-danger { background: #FDECEA; color: var(--danger); }
.badge-tip { background: #FF3B30; color: #fff; border-radius: 50%; width: 18px; height: 18px; text-align: center; line-height: 18px; font-size: 11px; padding: 0; }

/* Button */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 48px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: opacity 0.2s;
  -webkit-appearance: none;
}
.btn:active { opacity: 0.8; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-default { background: #F2F2F7; color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-block { width: 100%; }
.btn-sm { height: 36px; font-size: 14px; border-radius: 6px; padding: 0 14px; }

/* Search Bar */
.search-bar {
  margin: 12px 16px;
  display: flex;
  gap: 10px;
}
.search-input {
  flex: 1;
  height: 36px;
  border-radius: 10px;
  border: none;
  background: var(--card-bg);
  padding: 0 14px;
  font-size: 15px;
  outline: none;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

/* Tab Switcher */
.tab-switcher {
  display: flex;
  padding: 0 16px;
  gap: 8px;
  margin-bottom: 12px;
}
.tab-switch {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  background: var(--card-bg);
  color: var(--secondary);
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.tab-switch.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* User avatar card */
.avatar-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 20px 16px;
  background: var(--card-bg);
  margin: 12px 16px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.avatar {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 22px;
  font-weight: 600;
}
.user-info { flex: 1; }
.user-name { font-size: 18px; font-weight: 600; }
.user-dept { font-size: 13px; color: var(--secondary); margin-top: 4px; }

/* Empty State */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--secondary);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.empty-text { font-size: 14px; }

/* Arrow icon */
.arrow-right::after {
  content: '›';
  font-size: 20px;
  color: var(--secondary);
  margin-left: 6px;
}
</style>
</head>

function switchTab(tab) {
  // Update tab bar
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab-item[data-tab="${tab}"]`).classList.add('active');

  // Update header
  const titles = { home: '智慧园区管理平台', message: '消息中心', profile: '个人中心' };
  document.getElementById('headerTitle').textContent = titles[tab] || '';

  // Inject content
  document.getElementById('content').innerHTML = pages[tab] || '';

  // Hide back button
  document.querySelector('.header .back-btn')?.remove();
}

function goto(page) {
  window.location.href = `phase1/${page}_mo.html`;
}

function logout() {
  localStorage.removeItem('mo_token');
  window.location.href = 'login_mo.html';
}

function readMsg(el) {
  const badge = el.querySelector('.badge-tip');
  if (badge) badge.remove();
}

function switchMsgTab(el, type) {
  document.querySelectorAll('.tab-switch').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

// Update clock
function updateClock() {
  const now = new Date();
  const h = now.getHours().toString().padStart(2,'0');
  const m = now.getMinutes().toString().padStart(2,'0');
  document.getElementById('statusTime').textContent = `${h}:${m}`;
}
setInterval(updateClock, 1000);
updateClock();

// Init with home page
document.getElementById('content').innerHTML = pages.home;
</script>
</body>
