<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>消息模板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:#F5F5F7;color:#1C1C1E;font-size:14px;-webkit-font-smoothing:antialiased}
.page-wrap{max-width:430px;margin:0 auto;min-height:100vh;background:#F5F5F7}

/* Header */
.header{background:#fff;height:50px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid rgba(0,0,0,0.06);position:sticky;top:0;z-index:100}
.header h1{font-size:17px;font-weight:600;flex:1}
.add-btn{color:#007AFF;font-size:15px;cursor:pointer;font-weight:500}

/* List */
.list{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.template-card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06);padding:14px 16px}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.type-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.type-icon.sms{background:#E8F4FF;color:#007AFF}
.type-icon.email{background:#FFF3E8;color:#FF9500}
.type-icon.msg{background:#F0FFF0;color:#34C759}
.card-name{font-size:15px;font-weight:500;color:#1C1C1E;flex:1}
.status-tag{padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500}
.status-on{background:#E8F4FF;color:#007AFF}
.status-off{background:#F5F5F7;color:#8E8E93}
.card-footer{display:flex;justify-content:flex-end;gap:16px}
.op-btn{font-size:13px;color:#007AFF;cursor:pointer}
.op-btn.del{color:#FF3B30}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:300;justify-content:flex-end}
.modal-overlay.active{display:flex}
.modal{background:#fff;width:100%;height:100%;display:flex;flex-direction:column}
.modal-header{height:50px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid rgba(0,0,0,0.06);gap:12px}
.modal-header h2{flex:1;font-size:17px;font-weight:600}
.close-btn{font-size:24px;color:#8E8E93;cursor:pointer;width:30px;text-align:center}
.save-btn{color:#007AFF;font-size:15px;font-weight:500;cursor:pointer}

.modal-body{flex:1;overflow-y:auto;padding:16px}
.form-item{margin-bottom:20px}
.form-label{font-size:13px;color:#8E8E93;margin-bottom:8px;display:block}
.form-input{width:100%;height:44px;border:1px solid #E5E5EA;border-radius:8px;padding:0 12px;font-size:15px;font-family:inherit;outline:none}
.form-input:focus{border-color:#007AFF}
.form-select{width:100%;height:44px;border:1px solid #E5E5EA;border-radius:8px;padding:0 12px;font-size:15px;font-family:inherit;background:#fff;outline:none;appearance:none}
.form-textarea{width:100%;height:120px;border:1px solid #E5E5EA;border-radius:8px;padding:12px;font-size:15px;font-family:inherit;resize:none;outline:none;line-height:1.6}
.form-textarea:focus{border-color:#007AFF}

/* Switch */
.switch-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.switch-label{font-size:15px;color:#1C1C1E}
.switch{width:52px;height:32px;background:#D1D1D6;border-radius:16px;position:relative;cursor:pointer;transition:background 0.2s}
.switch.on{background:#34C759}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:28px;height:28px;background:#fff;border-radius:50%;transition:left 0.2s}
.switch.on::after{left:22px}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="header">
    <h1>消息模板</h1>
    <span class="add-btn" onclick="openModal()">+ 新增</span>
  </div>

  <div class="list">
    <div class="template-card">
      <div class="card-top">
        <div class="type-icon sms">💬</div>
        <div class="card-name">请假审批通知</div>
        <span class="status-tag status-on">启用</span>
      </div>
      <div class="card-footer">
        <span class="op-btn" onclick="openModal('edit')">编辑</span>
        <span class="op-btn del" onclick="delTemplate(this)">删除</span>
      </div>
    </div>

    <div class="template-card">
      <div class="card-top">
        <div class="type-icon email">📧</div>
        <div class="card-name">会议邀请函</div>
        <span class="status-tag status-on">启用</span>
      </div>
      <div class="card-footer">
        <span class="op-btn" onclick="openModal('edit')">编辑</span>
        <span class="op-btn del" onclick="delTemplate(this)">删除</span>
      </div>
    </div>

    <div class="template-card">
      <div class="card-top">
        <div class="type-icon msg">📨</div>
        <div class="card-name">系统升级提醒</div>
        <span class="status-tag status-off">禁用</span>
      </div>
      <div class="card-footer">
        <span class="op-btn" onclick="openModal('edit')">编辑</span>
        <span class="op-btn del" onclick="delTemplate(this)">删除</span>
      </div>
    </div>

    <div class="template-card">
      <div class="card-top">
        <div class="type-icon sms">💬</div>
        <div class="card-name">费用报销提醒</div>
        <span class="status-tag status-on">启用</span>
      </div>
      <div class="card-footer">
        <span class="op-btn" onclick="openModal('edit')">编辑</span>
        <span class="op-btn del" onclick="delTemplate(this)">删除</span>
      </div>
    </div>

    <div class="template-card">
      <div class="card-top">
        <div class="type-icon email">📧</div>
        <div class="card-name">月度报告汇总</div>
        <span class="status-tag status-off">禁用</span>
      </div>
      <div class="card-footer">
        <span class="op-btn" onclick="openModal('edit')">编辑</span>
        <span class="op-btn del" onclick="delTemplate(this)">删除</span>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="close-btn" onclick="closeModal()">×</span>
      <h2 id="modalTitle">新增模板</h2>
      <span class="save-btn" onclick="saveTemplate()">保存</span>
    </div>
    <div class="modal-body">
      <div class="form-item">
        <label class="form-label">模板名称</label>
        <input class="form-input" id="tplName" placeholder="请输入模板名称">
      </div>
      <div class="form-item">
        <label class="form-label">发送方式</label>
        <select class="form-select" id="tplType">
          <option value="sms">短信</option>
          <option value="email">邮件</option>
          <option value="msg">站内信</option>
        </select>
      </div>
      <div class="form-item">
        <label class="form-label">模板内容</label>
        <textarea class="form-textarea" id="tplContent" placeholder="请输入模板内容，支持变量：{name}、{date}、{content}等"></textarea>
      </div>
      <div class="form-item">
        <div class="switch-row">
          <span class="switch-label">启用状态</span>
          <div class="switch on" id="tplSwitch" onclick="toggleSwitch(this)"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
if (!localStorage.getItem('mo_user')) {
  location.href = 'login_mo.html';
}

function openModal(mode) {
  document.getElementById('modalTitle').textContent = mode === 'edit' ? '编辑模板' : '新增模板';
  document.getElementById('modalOverlay').classList.add('active');
  if (mode === 'edit') {
    document.getElementById('tplName').value = '请假审批通知';
    document.getElementById('tplType').value = 'sms';
    document.getElementById('tplContent').value = '尊敬的{name}，您的请假申请已{status}，审批日期：{date}。如有疑问请联系管理员。';
  } else {
    document.getElementById('tplName').value = '';
    document.getElementById('tplType').value = 'sms';
    document.getElementById('tplContent').value = '';
    document.getElementById('tplSwitch').classList.add('on');
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function toggleSwitch(el) {
  el.classList.toggle('on');
}

function saveTemplate() {
  var name = document.getElementById('tplName').value.trim();
  if (!name) {
    alert('请输入模板名称');
    return;
  }
  alert('保存成功');
  closeModal();
}

function delTemplate(el) {
  if (confirm('确定删除该模板？')) {
    el.closest('.template-card').remove();
  }
}
</script>
</body>
</html>
