<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>流程中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:#F5F5F7;color:#1C1C1E;font-size:14px;-webkit-font-smoothing:antialiased}
.page-wrap{max-width:430px;margin:0 auto;min-height:100vh;background:#F5F5F7;padding-bottom:70px}

/* Header */
.header{position:sticky;top:0;z-index:100;background:#fff;height:50px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(0,0,0,0.06)}
.header h1{font-size:17px;font-weight:600;color:#1C1C1E}

/* Filter Tabs */
.filter-tabs{display:flex;background:#fff;padding:0 16px;gap:24px;border-bottom:1px solid rgba(0,0,0,0.06)}
.filter-tab{padding:12px 0;font-size:15px;color:#8E8E93;position:relative;cursor:pointer}
.filter-tab.active{color:#007AFF;font-weight:600}
.filter-tab.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:#007AFF;border-radius:1px}

/* List */
.list{padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06);padding:14px;cursor:pointer;transition:opacity 0.2s}
.card:active{opacity:0.7}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.card-icon.leave{background:#E8F4FF;color:#007AFF}
.card-icon.expense{background:#FFF3E8;color:#FF9500}
.card-icon.purchase{background:#F0FFF0;color:#34C759}
.card-icon.travel{background:#F5F0FF;color:#AF52DE}
.card-title{font-size:15px;font-weight:500;color:#1C1C1E;flex:1}
.card-badge{padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500}
.badge-pending{background:#FFF3E8;color:#FF9500}
.badge-done{background:#E8F4FF;color:#007AFF}
.badge-reject{background:#FFEBEA;color:#FF3B30}
.card-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#8E8E93}
.card-time{font-size:12px}
.load-more{text-align:center;padding:16px;color:#8E8E93;font-size:13px}

/* Bottom Tab */
.bottom-tab{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:430px;max-width:100%;background:#fff;border-top:1px solid rgba(0,0,0,0.06);height:50px;display:flex;z-index:200}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:#8E8E93;text-decoration:none}
.tab-item.active{color:#007AFF}
.tab-icon{font-size:20px}
.tab-label{font-size:10px}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="header">
    <h1>流程中心</h1>
  </div>
  <div class="filter-tabs">
    <div class="filter-tab active" onclick="switchTab(this)">全部</div>
    <div class="filter-tab" onclick="switchTab(this)">待办</div>
    <div class="filter-tab" onclick="switchTab(this)">已发</div>
    <div class="filter-tab" onclick="switchTab(this)">已处理</div>
  </div>
  <div class="list" id="list">
    <div class="card" onclick="location.href='workflow_detail_mo.html'">
      <div class="card-header">
        <div class="card-icon leave">✈</div>
        <div class="card-title">请假申请</div>
        <span class="card-badge badge-pending">待审批</span>
      </div>
      <div class="card-meta">
        <span>张明 · 开发部</span>
        <span class="card-time">10:30</span>
      </div>
    </div>
    <div class="card" onclick="location.href='workflow_detail_mo.html'">
      <div class="card-header">
        <div class="card-icon expense">💰</div>
        <div class="card-title">费用报销</div>
        <span class="card-badge badge-pending">待审批</span>
      </div>
      <div class="card-meta">
        <span>李华 · 财务部</span>
        <span class="card-time">09:15</span>
      </div>
    </div>
    <div class="card" onclick="location.href='workflow_detail_mo.html'">
      <div class="card-header">
        <div class="card-icon purchase">📦</div>
        <div class="card-title">采购申请</div>
        <span class="card-badge badge-done">已通过</span>
      </div>
      <div class="card-meta">
        <span>王芳 · 行政部</span>
        <span class="card-time">昨天</span>
      </div>
    </div>
    <div class="card" onclick="location.href='workflow_detail_mo.html'">
      <div class="card-header">
        <div class="card-icon travel">🚗</div>
        <div class="card-title">差旅申请</div>
        <span class="card-badge badge-reject">已驳回</span>
      </div>
      <div class="card-meta">
        <span>赵强 · 市场部</span>
        <span class="card-time">昨天</span>
      </div>
    </div>
    <div class="card" onclick="location.href='workflow_detail_mo.html'">
      <div class="card-header">
        <div class="card-icon leave">✈</div>
        <div class="card-title">年假申请</div>
        <span class="card-badge badge-pending">待审批</span>
      </div>
      <div class="card-meta">
        <span>孙丽 · 人事部</span>
        <span class="card-time">08:45</span>
      </div>
    </div>
    <div class="card" onclick="location.href='workflow_detail_mo.html'">
      <div class="card-header">
        <div class="card-icon expense">💰</div>
        <div class="card-title">招待费用</div>
        <span class="card-badge badge-pending">待审批</span>
      </div>
      <div class="card-meta">
        <span>周杰 · 销售部</span>
        <span class="card-time">08:20</span>
      </div>
    </div>
  </div>
  <div class="load-more">上拉加载更多...</div>
</div>

<!-- Bottom Tab -->
<div class="bottom-tab">
  <a href="portal_preview_mo.html" class="tab-item">
    <span class="tab-icon">🏠</span>
    <span class="tab-label">工作台</span>
  </a>
  <a href="notification_center_mo.html" class="tab-item">
    <span class="tab-icon">💬</span>
    <span class="tab-label">消息</span>
  </a>
  <a href="workflow_mo.html" class="tab-item active">
    <span class="tab-icon">✓</span>
    <span class="tab-label">审批</span>
  </a>
  <a href="#" class="tab-item">
    <span class="tab-icon">👤</span>
    <span class="tab-label">我的</span>
  </a>
</div>

<script>
// Check login
if (!localStorage.getItem('mo_user')) {
  location.href = 'login_mo.html';
}
function switchTab(el) {
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}
</script>
</body>
</html>
