<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>主题配置 - 云枢中台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",sans-serif;background:#F5F5F7;color:#1D1D1F;font-size:14px}
.topbar{height:56px;background:#fff;border-bottom:1px solid #E5E5E5;display:flex;align-items:center;padding:0 24px;gap:8px}
.topbar .crumb{color:#8E8E93;font-size:14px}
.topbar .crumb span{color:#1D1D1F}
.page-title{font-size:18px;font-weight:600;margin-bottom:20px;padding-top:20px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06);margin-bottom:16px;overflow:hidden;padding:20px}
.search-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search-bar input{flex:1;min-width:200px;height:36px;border:1px solid #E5E5E5;border-radius:8px;padding:0 12px;font-size:14px;outline:none}
.search-bar input:focus{border-color:#007AFF}
.search-bar select{height:36px;border:1px solid #E5E5E5;border-radius:8px;padding:0 12px;font-size:14px;background:#fff;min-width:140px}
.btn-primary{height:36px;background:#007AFF;color:#fff;border:none;border-radius:8px;padding:0 16px;font-size:14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;white-space:nowrap}
.btn-default{height:36px;background:#fff;color:#1d1d1f;border:1px solid #E5E5E5;border-radius:8px;padding:0 16px;font-size:14px;cursor:pointer}
.card-title{font-size:16px;font-weight:600;color:#1d1d1f;margin-bottom:16px}
.table{width:100%;border-collapse:collapse}
.table th{background:#FAFAFA;padding:12px 16px;text-align:left;font-size:13px;color:#8E8E93;font-weight:500;border-bottom:1px solid #E5E5E5}
.table td{padding:14px 16px;font-size:14px;border-bottom:1px solid #F0F0F0;vertical-align:middle}
.table tr:hover{background:#F9F9FB}
.color-swatch{display:inline-flex;align-items:center;gap:6px}
.color-dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,0.1);display:inline-block}
.tag{padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;display:inline-block}
.tag-published{background:#E8F5E9;color:#34C759}
.tag-draft{background:#F5F5F7;color:#8E8E93}
.action-btn{color:#007AFF;cursor:pointer;font-size:13px;background:none;border:none;padding:0 4px;margin-right:4px}
.action-btn:hover{text-decoration:underline}
.action-btn.danger{color:#FF3B30}
.pagination{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.pagination .info{font-size:13px;color:#8E8E93}
.page-btn{width:32px;height:32px;border:1px solid #E5E5E5;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;margin-left:4px}
.page-btn.active{background:#007AFF;color:#fff;border-color:#007AFF}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:16px;width:90%;max-width:700px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column}
.modal-header{height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E5E5E5}
.modal-title{font-size:16px;font-weight:600}
.modal-close{width:32px;height:32px;border-radius:50%;background:#F5F5F7;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:#8E8E93;border:none}
.modal-body{flex:1;overflow-y:auto;padding:20px}
.modal-footer{padding:16px 20px;border-top:1px solid #E5E5E5;display:flex;justify-content:flex-end;gap:12px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:#8E8E93;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;height:40px;border:1px solid #E5E5E5;border-radius:8px;padding:0 12px;font-size:14px;outline:none;background:#fff}
.form-group input[type="color"]{padding:4px 8px;cursor:pointer}
.form-group textarea{height:80px;padding:10px 12px;resize:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#007AFF}
.form-row{display:flex;gap:16px}
.form-row .form-group{flex:1}
.color-row{display:flex;gap:16px;align-items:flex-end}
.color-row .form-group{flex:1}
.color-input-wrap{display:flex;align-items:center;gap:8px}
.color-input-wrap input[type="color"]{width:60px;height:40px;border:1px solid #E5E5E5;border-radius:8px;padding:4px;cursor:pointer}
.color-input-wrap input[type="text"]{flex:1;height:40px;border:1px solid #E5E5E5;border-radius:8px;padding:0 12px;font-size:14px;outline:none}
.color-input-wrap input[type="text"]:focus{border-color:#007AFF}
.preview-iframe{width:100%;height:600px;border:1px solid #E5E5E5;border-radius:8px;background:#FAFAFA}
/* 预览弹窗更大 */
.modal.preview{width:95%;max-width:1100px}
.theme-preview-box{width:100%;height:500px;border-radius:12px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.theme-preview-header{height:48px;display:flex;align-items:center;padding:0 16px;gap:12px}
.theme-preview-logo{width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,0.2)}
.theme-preview-nav{flex:1;display:flex;gap:16px}
.theme-preview-nav span{font-size:12px;opacity:0.8}
.theme-preview-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.theme-preview-title{font-size:20px;font-weight:600;margin-bottom:8px}
.theme-preview-desc{font-size:13px;opacity:0.7;margin-bottom:20px}
.theme-preview-btn{padding:8px 20px;border-radius:8px;font-size:13px;font-weight:500}
.theme-preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;margin-top:16px}
.theme-preview-card{padding:16px;border-radius:8px;opacity:0.9}
.theme-preview-card-title{font-size:12px;font-weight:500;margin-bottom:4px}
.theme-preview-card-desc{font-size:10px;opacity:0.6}
</style>
</head>
<body>
<div class="topbar">
<span class="crumb">门户管理 ▶ <span>主题配置</span></span>
</div>
<div style="padding:0 24px 24px">
<div class="page-title">主题配置</div>
<div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索主题名称" oninput="filterTable()">
        <select id="statusFilter" onchange="filterTable()">
          <option value="">全部状态</option>
          <option>简约白</option>
          <option>科技蓝</option>
          <option>活力橙</option>
          <option>午夜黑</option>
        </select>
        <button class="btn-primary" onclick="openNewModal()">+ 新建主题</button>
      </div>
      <div class="card">
        <table class="table">
          <thead><tr><th>主题名称</th><th>主题色系</th><th>背景类型</th><th>字体配色</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div class="pagination">
          <div class="info">共 <span id="totalCount">3</span> 条</div>
          <div><button class="page-btn active">1</button></div>
        </div>
      </div>
</div>

<!-- 新建/编辑主题弹窗 -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title" id="formTitle">新建主题</div><button class="modal-close" onclick="closeModal('formModal')">×</button></div>
    <div class="modal-body">
      <div class="form-group"><label>主题名称</label><input type="text" id="themeName" placeholder="请输入主题名称，如：简约白"></div>
      <div class="form-row">
        <div class="form-group"><label>背景类型</label>
          <select id="bgType">
            <option value="white">纯色背景</option>
            <option value="gradient">渐变背景</option>
            <option value="image">图片背景</option>
          </select>
        </div>
        <div class="form-group"><label>字体配色</label>
          <select id="fontColor">
            <option value="dark">深色文字</option>
            <option value="light">浅色文字</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>主色调</label>
          <div class="color-input-wrap">
            <input type="color" id="primaryColor" value="#007AFF" onchange="updateColorText('primary')">
            <input type="text" id="primaryColorText" value="#007AFF" onchange="updateColorPicker('primary')">
          </div>
        </div>
        <div class="form-group"><label>辅助色</label>
          <div class="color-input-wrap">
            <input type="color" id="secondaryColor" value="#FFFFFF" onchange="updateColorText('secondary')">
            <input type="text" id="secondaryColorText" value="#FFFFFF" onchange="updateColorPicker('secondary')">
          </div>
        </div>
      </div>
      <div class="form-group"><label>状态</label>
        <select id="themeStatus">
          <option value="draft">草稿</option>
          <option value="published">已发布</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-default" onclick="closeModal('formModal')">取消</button>
      <button class="btn-primary" onclick="saveTheme()">保存</button>
    </div>
  </div>
</div>

<!-- 主题预览弹窗 -->
<div class="modal-overlay" id="previewModal">
  <div class="modal preview">
    <div class="modal-header"><div class="modal-title" id="previewTitle">主题预览 - 简约白</div><button class="modal-close" onclick="closeModal('previewModal')">×</button></div>
    <div class="modal-body" style="padding:0">
      <div class="theme-preview-box" id="themePreviewBox">
        <div class="theme-preview-header">
          <div class="theme-preview-logo"></div>
          <div class="theme-preview-nav">
            <span>首页</span><span>产品</span><span>解决方案</span><span>关于我们</span>
          </div>
        </div>
        <div class="theme-preview-content">
          <div class="theme-preview-title">欢迎使用云枢平台</div>
          <div class="theme-preview-desc">简洁高效的企业级中台管理系统</div>
          <div class="theme-preview-btn" id="previewBtn">立即体验</div>
          <div class="theme-preview-grid">
            <div class="theme-preview-card" id="card1">
              <div class="theme-preview-card-title">智能分析</div>
              <div class="theme-preview-card-desc">数据驱动决策</div>
            </div>
            <div class="theme-preview-card" id="card2">
              <div class="theme-preview-card-title">高效协同</div>
              <div class="theme-preview-card-desc">团队无缝配合</div>
            </div>
            <div class="theme-preview-card" id="card3">
              <div class="theme-preview-card-title">安全可靠</div>
              <div class="theme-preview-card-desc">企业级保障</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-default" onclick="closeModal('previewModal')">关闭</button>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header"><div class="modal-title">确认删除</div><button class="modal-close" onclick="closeModal('deleteModal')">×</button></div>
    <div class="modal-body">
      <p style="padding:8px 0;color:#1D1D1F">确定要删除主题「<span id="deleteThemeName"></span>」吗？删除后不可恢复。</p>
    </div>
    <div class="modal-footer">
      <button class="btn-default" onclick="closeModal('deleteModal')">取消</button>
      <button class="btn-primary" style="background:#FF3B30" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<script>
var themes=[
  {name:'简约白',primary:'#FFFFFF',secondary:'#1D1D1F',bgType:'white',fontColor:'dark',status:'published',time:'2026-04-10'},
  {name:'科技蓝',primary:'#0A1628',secondary:'#007AFF',bgType:'dark',fontColor:'light',status:'published',time:'2026-04-12'},
  {name:'活力橙',primary:'#FF9500',secondary:'#FFFFFF',bgType:'gradient',fontColor:'dark',status:'draft',time:'2026-05-01'},
];

var themeStyles={
  '简约白':{headerBg:'#FFFFFF',headerText:'#1D1D1F',bodyBg:'#F5F5F7',bodyText:'#1D1D1F',cardBg:'#FFFFFF',cardText:'#1D1D1F',btnBg:'#007AFF',btnText:'#FFFFFF',logoBg:'rgba(0,122,255,0.15)',card1Bg:'rgba(0,122,255,0.08)',card2Bg:'rgba(0,122,255,0.08)',card3Bg:'rgba(0,122,255,0.08)'},
  '科技蓝':{headerBg:'#0A1628',headerText:'#FFFFFF',bodyBg:'#071222',bodyText:'#E5E5E7',cardBg:'#0D2137',cardText:'#E5E5E7',btnBg:'#007AFF',btnText:'#FFFFFF',logoBg:'rgba(0,122,255,0.3)',card1Bg:'rgba(0,122,255,0.15)',card2Bg:'rgba(0,122,255,0.15)',card3Bg:'rgba(0,122,255,0.15)'},
  '活力橙':{headerBg:'#FF9500',headerText:'#FFFFFF',bodyBg:'linear-gradient(135deg, #FF9500 0%, #FF6B00 100%)',bodyText:'#FFFFFF',cardBg:'rgba(255,255,255,0.95)',cardText:'#1D1D1F',btnBg:'#FFFFFF',btnText:'#FF9500',logoBg:'rgba(255,255,255,0.25)',card1Bg:'rgba(255,255,255,0.9)',card2Bg:'rgba(255,255,255,0.9)',card3Bg:'rgba(255,255,255,0.9)'},
  '午夜黑':{headerBg:'#1D1D1F',headerText:'#FFFFFF',bodyBg:'#000000',bodyText:'#F5F5F7',cardBg:'#2C2C2E',cardText:'#F5F5F7',btnBg:'#0A84FF',btnText:'#FFFFFF',logoBg:'rgba(10,132,255,0.25)',card1Bg:'rgba(10,132,255,0.12)',card2Bg:'rgba(10,132,255,0.12)',card3Bg:'rgba(10,132,255,0.12)'},
};

var bgTypeMap={white:'白色背景',dark:'深色背景',gradient:'渐变背景',image:'图片背景'};
var fontColorMap={dark:'深色文字',light:'浅色文字'};
var statusMap={published:'已发布',draft:'草稿'};
var statusClass={published:'tag-published',draft:'tag-draft'};

var currentEditIndex=-1;
var currentDeleteIndex=-1;

function renderTable(){
  var tbody=document.getElementById('tableBody');
  tbody.innerHTML=themes.map(function(t,i){
    return '<tr>'+
      '<td><strong>'+t.name+'</strong></td>'+
      '<td><div class="color-swatch"><span class="color-dot" style="background:'+t.primary+'"></span>'+t.primary+' / <span class="color-dot" style="background:'+t.secondary+'"></span>'+t.secondary+'</div></td>'+
      '<td>'+bgTypeMap[t.bgType]+'</td>'+
      '<td>'+fontColorMap[t.fontColor]+'</td>'+
      '<td><span class="tag '+statusClass[t.status]+'">'+statusMap[t.status]+'</span></td>'+
      '<td>'+t.time+'</td>'+
      '<td><button class="action-btn" onclick="openEditModal('+i+')">编辑</button><button class="action-btn" onclick="openPreview('+i+')">预览</button><button class="action-btn" onclick="copyTheme('+i+')">复制</button><button class="action-btn danger" onclick="openDeleteModal('+i+')">删除</button></td>'+
      '</tr>';
  }).join('');
  document.getElementById('totalCount').textContent=themes.length;
}

function filterTable(){
  var keyword=document.getElementById('searchInput').value.toLowerCase();
  var status=document.getElementById('statusFilter').value;
  var tbody=document.getElementById('tableBody');
  var filtered=themes.filter(function(t){
    var matchKeyword=!keyword||t.name.toLowerCase().indexOf(keyword)>-1;
    var matchStatus=!status||t.name===status;
    return matchKeyword&&matchStatus;
  });
  tbody.innerHTML=filtered.map(function(t,i){
    var realIndex=themes.indexOf(t);
    return '<tr>'+
      '<td><strong>'+t.name+'</strong></td>'+
      '<td><div class="color-swatch"><span class="color-dot" style="background:'+t.primary+'"></span>'+t.primary+' / <span class="color-dot" style="background:'+t.secondary+'"></span>'+t.secondary+'</div></td>'+
      '<td>'+bgTypeMap[t.bgType]+'</td>'+
      '<td>'+fontColorMap[t.fontColor]+'</td>'+
      '<td><span class="tag '+statusClass[t.status]+'">'+statusMap[t.status]+'</span></td>'+
      '<td>'+t.time+'</td>'+
      '<td><button class="action-btn" onclick="openEditModal('+realIndex+')">编辑</button><button class="action-btn" onclick="openPreview('+realIndex+')">预览</button><button class="action-btn" onclick="copyTheme('+realIndex+')">复制</button><button class="action-btn danger" onclick="openDeleteModal('+realIndex+')">删除</button></td>'+
      '</tr>';
  }).join('');
  document.getElementById('totalCount').textContent=filtered.length;
}

function openNewModal(){
  currentEditIndex=-1;
  document.getElementById('formTitle').textContent='新建主题';
  document.getElementById('themeName').value='';
  document.getElementById('bgType').value='white';
  document.getElementById('fontColor').value='dark';
  document.getElementById('primaryColor').value='#007AFF';
  document.getElementById('primaryColorText').value='#007AFF';
  document.getElementById('secondaryColor').value='#FFFFFF';
  document.getElementById('secondaryColorText').value='#FFFFFF';
  document.getElementById('themeStatus').value='draft';
  document.getElementById('formModal').style.display='flex';
}

function openEditModal(index){
  currentEditIndex=index;
  var t=themes[index];
  document.getElementById('formTitle').textContent='编辑主题';
  document.getElementById('themeName').value=t.name;
  document.getElementById('bgType').value=t.bgType;
  document.getElementById('fontColor').value=t.fontColor;
  document.getElementById('primaryColor').value=t.primary;
  document.getElementById('primaryColorText').value=t.primary;
  document.getElementById('secondaryColor').value=t.secondary;
  document.getElementById('secondaryColorText').value=t.secondary;
  document.getElementById('themeStatus').value=t.status;
  document.getElementById('formModal').style.display='flex';
}

function saveTheme(){
  var name=document.getElementById('themeName').value.trim();
  if(!name){alert('请输入主题名称');return;}
  var themeData={
    name:name,
    bgType:document.getElementById('bgType').value,
    fontColor:document.getElementById('fontColor').value,
    primary:document.getElementById('primaryColor').value,
    secondary:document.getElementById('secondaryColor').value,
    status:document.getElementById('themeStatus').value,
    time:currentEditIndex>=0?themes[currentEditIndex].time:new Date().toISOString().slice(0,10)
  };
  if(currentEditIndex>=0){
    themes[currentEditIndex]=themeData;
  }else{
    themes.push(themeData);
  }
  closeModal('formModal');
  renderTable();
}

function copyTheme(index){
  var t=themes[index];
  var newTheme=Object.assign({},t);
  newTheme.name=t.name+'_副本';
  newTheme.time=new Date().toISOString().slice(0,10);
  newTheme.status='draft';
  themes.push(newTheme);
  renderTable();
}

function openDeleteModal(index){
  currentDeleteIndex=index;
  document.getElementById('deleteThemeName').textContent=themes[index].name;
  document.getElementById('deleteModal').style.display='flex';
}

function confirmDelete(){
  if(currentDeleteIndex>=0){
    themes.splice(currentDeleteIndex,1);
    currentDeleteIndex=-1;
    closeModal('deleteModal');
    renderTable();
  }
}

function openPreview(index){
  var t=themes[index];
  var style=themeStyles[t.name]||themeStyles['简约白'];
  document.getElementById('previewTitle').textContent='主题预览 - '+t.name;
  var box=document.getElementById('themePreviewBox');
  box.style.background=style.bodyBg;
  box.querySelector('.theme-preview-header').style.background=style.headerBg;
  box.querySelector('.theme-preview-header').style.color=style.headerText;
  box.querySelector('.theme-preview-logo').style.background=style.logoBg;
  var navSpans=box.querySelectorAll('.theme-preview-nav span');
  navSpans.forEach(function(s){s.style.color=style.headerText;});
  box.querySelector('.theme-preview-content').style.color=style.bodyText;
  box.querySelector('.theme-preview-title').style.color=style.bodyText;
  box.querySelector('.theme-preview-desc').style.color=style.bodyText;
  var btn=document.getElementById('previewBtn');
  btn.style.background=style.btnBg;
  btn.style.color=style.btnText;
  var card1=document.getElementById('card1');
  card1.style.background=style.card1Bg;
  card1.querySelector('.theme-preview-card-title').style.color=style.cardText;
  card1.querySelector('.theme-preview-card-desc').style.color=style.cardText;
  var card2=document.getElementById('card2');
  card2.style.background=style.card2Bg;
  card2.querySelector('.theme-preview-card-title').style.color=style.cardText;
  card2.querySelector('.theme-preview-card-desc').style.color=style.cardText;
  var card3=document.getElementById('card3');
  card3.style.background=style.card3Bg;
  card3.querySelector('.theme-preview-card-title').style.color=style.cardText;
  card3.querySelector('.theme-preview-card-desc').style.color=style.cardText;
  document.getElementById('previewModal').style.display='flex';
}

function updateColorText(type){
  if(type==='primary'){
    document.getElementById('primaryColorText').value=document.getElementById('primaryColor').value;
  }else{
    document.getElementById('secondaryColorText').value=document.getElementById('secondaryColor').value;
  }
}

function updateColorPicker(type){
  if(type==='primary'){
    var val=document.getElementById('primaryColorText').value;
    if(/^#[0-9A-Fa-f]{6}$/.test(val)){
      document.getElementById('primaryColor').value=val;
    }
  }else{
    var val=document.getElementById('secondaryColorText').value;
    if(/^#[0-9A-Fa-f]{6}$/.test(val)){
      document.getElementById('secondaryColor').value=val;
    }
  }
}

function closeModal(id){document.getElementById(id).style.display='none';}

document.addEventListener('DOMContentLoaded',renderTable);
</script>
</body>
</html>
