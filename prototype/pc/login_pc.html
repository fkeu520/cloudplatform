<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 平台管理系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)}
.card{background:#fff;border-radius:20px;padding:48px 40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.logo-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:32px}
.logo{width:64px;height:64px;background:linear-gradient(135deg,#007AFF,#5856D6);border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:28px;margin-bottom:12px}
.title{font-size:22px;font-weight:600;color:#1D1D1F;margin-bottom:4px}
.subtitle{font-size:13px;color:#8E8E93}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:#515154;margin-bottom:6px;font-weight:500}
.form-group input{width:100%;padding:12px 14px;border:1px solid #E5E5E5;border-radius:10px;font-size:14px;outline:none;transition:border-color 0.2s,box-shadow 0.2s}
.form-group input:focus{border-color:#007AFF;box-shadow:0 0 0 3px rgba(0,122,255,0.1)}
.remember{display:flex;align-items:center;justify-content:space-between;margin:20px 0 24px}
.remember label{display:flex;align-items:center;font-size:13px;color:#515154;cursor:pointer}
.remember input[type="checkbox"]{width:16px;height:16px;accent-color:#007AFF}
.remember a{font-size:13px;color:#007AFF;text-decoration:none}
.btn-login{width:100%;padding:14px;background:#007AFF;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:background 0.2s}
.btn-login:hover{background:#0066DD}
.hint{margin-top:24px;text-align:center;font-size:12px;color:#8E8E93}
.hint span{color:#007AFF}
</style>
</head>
<body>
<div class="card">
<div class="logo-wrap">
<div class="logo">P</div>
<div class="title">平台管理系统</div>
<div class="subtitle">Platform Management System</div>
</div>
<form id="loginForm" onsubmit="return doLogin()">
<div class="form-group">
<label>用户名</label>
<input type="text" id="username" value="admin" placeholder="请输入用户名">
</div>
<div class="form-group">
<label>密码</label>
<input type="password" id="password" value="123456" placeholder="请输入密码">
</div>
<div class="remember">
<label><input type="checkbox" checked>记住我</label>
<a href="#">忘记密码？</a>
</div>
<button type="submit" class="btn-login">登 录</button>
</form>
<div class="hint">演示账号: <span>admin / 123456</span></div>
</div>
<script>
function doLogin(){
var u=document.getElementById("username").value;
var p=document.getElementById("password").value;
if(!u||!p){alert("请输入用户名和密码");return false;}
localStorage.setItem("pc_logged","1");
localStorage.setItem("pc_user",u);
location.replace("index_pc.html");
return false;
}
</script>
</body>
</html>
