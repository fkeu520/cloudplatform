<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平台管理系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",sans-serif;background:#F5F5F7;color:#1D1D1F;height:100vh;overflow:hidden}
.logo-area{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid #E5E5E5}
.logo{width:32px;height:32px;background:linear-gradient(135deg,#007AFF,#5856D6);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
.sys-name{font-size:15px;font-weight:600;color:#1D1D1F}
.menu-item{color:#1D1D1F;font-size:14px;padding:10px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background 0.15s;border-radius:8px;margin:1px 8px}
.menu-item:hover{background:#F5F5F7}
.menu-item.active{background:#E8F0FE;color:#007AFF;font-weight:500}
.menu-item .icon{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0}
.menu-item .arrow{margin-left:auto;font-size:10px;color:#8E8E93;transition:transform 0.2s}
.menu-item.open .arrow{transform:rotate(90deg)}
.submenu{padding-left:0;overflow:hidden;max-height:0;transition:max-height 0.25s ease-out}
.submenu.open{max-height:500px}
.submenu-item{padding:8px 14px 8px 44px;font-size:13px;color:#515154;cursor:pointer;border-radius:6px;margin:1px 0}
.submenu-item:hover{background:#F0F0F5;color:#007AFF}
.submenu-item.active{background:#E8F0FE;color:#007AFF;font-weight:500}
.topbar{height:48px;background:#fff;border-bottom:1px solid #E5E5E5;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.topbar .breadcrumb{font-size:13px;color:#8E8E93}
.topbar .user{width:32px;height:32px;border-radius:50%;background:#E8F0FE;color:#007AFF;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;cursor:pointer}
.topbar .user:hover{background:#D0E8FF}
</style>
</head>
<body>
<div style="display:flex;height:100vh">
<div style="width:230px;background:#fff;border-right:1px solid #E5E5E5;display:flex;flex-direction:column;overflow-y:auto">
<div class="logo-area">
<div class="logo">P</div>
<div class="sys-name">平台管理系统</div>
</div>
<div style="padding:6px 0;flex:1" id="menuContainer"></div>
</div>
<div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
<div class="topbar"><div class="breadcrumb" id="breadcrumb">数据看板</div><div class="user" title="admin">管</div></div>
<iframe id="contentFrame" src="phase1/dashboard.html" style="border:none;width:100%;height:calc(100vh - 48px)"></iframe>
</div>
</div>
<script>
var menus=[
  {name:"数据看板",icon:"🏠",iconBg:"#34C759",path:"phase1/dashboard.html"},
  {name:"系统管理",icon:"⚙️",iconBg:"#8E8E93",open:true,children:[
    {name:"用户管理",path:"phase1/user.html"},
    {name:"角色管理",path:"phase1/role.html"},
    {name:"菜单管理",path:"phase1/menu.html"},
    {name:"组织管理",path:"phase1/org.html"},
    {name:"字典管理",path:"phase1/dict.html"},
    {name:"参数配置",path:"phase1/config.html"},
    {name:"操作日志",path:"phase1/oper-log.html"}
  ]},
  {name:"流程中心",icon:"🔀",iconBg:"#FF9500",open:true,children:[
    {name:"流程定义",path:"phase2/workflow-design.html"},
    {name:"任务中心",path:"phase2/workflow-task.html"},
    {name:"流程监控",path:"phase2/workflow-monitor.html"},
    {name:"流程统计",path:"phase2/workflow-stats.html"}
  ]},
  {name:"门户管理",icon:"🖥️",iconBg:"#5856D6",open:true,children:[
    {name:"站点管理",path:"phase2/portal-manage.html"},
    {name:"主题配置",path:"phase2/theme.html"},
    {name:"布局配置",path:"phase2/config.html"},
    {name:"预览发布",path:"phase2/preview.html"}
  ]}
];

function renderMenus(){
  var container=document.getElementById("menuContainer");
  var html="";
  menus.forEach(function(m,mi){
    var hasChildren=m.children&&m.children.length>0;
    var openClass=hasChildren&&m.open?" open":"";
    html+='<div class="menu-item'+openClass+'" data-idx="'+mi+'" onclick="toggleMenu(this,'+mi+')">';
    html+='<span class="icon" style="background:'+m.iconBg+'">'+m.icon+'</span>';
    html+='<span>'+m.name+'</span>';
    if(hasChildren) html+='<span class="arrow">▶</span>';
    html+='</div>';
    if(hasChildren){
      html+='<div class="submenu'+(m.open?" open":"")+'">';
      m.children.forEach(function(s){
        html+='<div class="submenu-item" onclick="event.stopPropagation();navigate(\''+s.path+'\',\''+s.name+'\')">'+s.name+'</div>';
      });
      html+='</div>';
    }
  });
  container.innerHTML=html;
  // 默认激活数据看板
  var first=container.querySelector(".menu-item");
  if(first) first.classList.add("active");
}

function toggleMenu(el,idx){
  var m=menus[idx];
  if(m.children&&m.children.length>0){
    // 有子菜单：展开/收起
    var submenu=el.nextElementSibling;
    if(submenu&&submenu.classList.contains("submenu")){
      var isOpen=el.classList.contains("open");
      el.classList.toggle("open");
      submenu.classList.toggle("open");
    }
  }
  if(m.path){
    navigate(m.path,m.name);
  }
}

function navigate(path,name){
  if(!path) return;
  document.getElementById("contentFrame").src=path;
  document.getElementById("breadcrumb").textContent=name;
  // 高亮
  document.querySelectorAll(".menu-item,.submenu-item").forEach(function(el){el.classList.remove("active")});
  document.querySelectorAll(".submenu-item").forEach(function(el){
    if(el.textContent.trim()===name) el.classList.add("active");
  });
  // 同时高亮父级菜单
  document.querySelectorAll(".menu-item").forEach(function(el){
    var arrow=el.querySelector(".arrow");
    if(arrow){
      var submenu=el.nextElementSibling;
      if(submenu&&submenu.classList.contains("submenu")){
        var activeInSub=submenu.querySelector(".submenu-item.active");
        if(activeInSub) el.classList.add("active");
      }
    }
  });
}

renderMenus();
</script>
</body>
</html>
