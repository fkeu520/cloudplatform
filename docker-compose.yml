
# ==============================================================================
# Docker Compose Installation Path
# ==============================================================================
# Windows: C:\Program Files\Docker\Docker\resources\bin\docker-compose.exe
# Usage: & "C:\Program Files\Docker\Docker\resources\bin\docker-compose.exe" up -d
# ==============================================================================

# 共享日志配置: GELF UDP → Logstash → Elasticsearch (1 天 ILM 保留)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============ MySQL 8.0 ============
  mysql:
    image: mysql:8.0
    container_name: platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: platform
      MYSQL_USER: platform
      MYSQL_PASSWORD: platform123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Redis 7 ============
  redis:
    image: redis:7-alpine
    container_name: platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Kafka 7.5 ============
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: platform-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============ Nacos 2.1 (JDK 8 版本, 兼容 cgroup v2) ============
  nacos:
    image: nacos/nacos-server:v2.1.2
    container_name: platform-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: false
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-cGxhY2Vob2xkZXItc2VjcmV0LWtleQo=}
      JVM_XMS: 512m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ============ MinIO ============
  minio:
    image: minio/minio:latest
    container_name: platform-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_DEFAULT_BUCKETS: platform
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 3

  # ============ Elasticsearch 8.x ============
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: platform-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *default-logging

  # ============ Elasticsearch Init (one-shot) ============
  # 等待 ES 就绪后创建 ILM 策略 + 索引模板
  elasticsearch-init:
    image: curlimages/curl:8.7.1
    container_name: platform-es-init
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./docker/elasticsearch/ilm-policy.json:/init/ilm-policy.json:ro
      - ./docker/elasticsearch/index-template.json:/init/index-template.json:ro
      - ./docker/elasticsearch/init.sh:/init/init.sh:ro
    entrypoint: ["/bin/sh", "/init/init.sh"]
    restart: "no"

  # ============ Kibana ============
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: platform-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  # ============ Logstash ============
  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: platform-logstash
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "5000:5000"      # TCP/JSON 兼容输入
      - "12201:12201/udp" # GELF UDP 输入 (Docker logging driver)
    volumes:
      - ./docker/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9600"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ============ XXL-JOB Admin ============
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: platform-xxl-job-admin
    restart: unless-stopped
    environment:
      - PARAMS=--spring.datasource.url=jdbc:mysql://mysql:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai --spring.datasource.username=platform --spring.datasource.password=platform123
    ports:
      - "8088:8088"
    volumes:
      - xxl-job-data:/data/applogs
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/xxl-job-admin/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ 后端服务 ============
  platform-user:
    image: ghcr.io/fkeu520/cloudplatform/platform-user:latest
    container_name: platform-user
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - 'SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai'
      - SPRING_DATASOURCE_USERNAME=platform
      - SPRING_DATASOURCE_PASSWORD=platform123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=nacos:8848
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MYBATIS_PLUS_SNOWFLAKE_WORKER_ID=1
      - MYBATIS_PLUS_SNOWFLAKE_DATACENTER_ID=1
      - JAVA_OPTS=${JAVA_OPTS:--Xmx768m -Xms384m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof}
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/user/v3/api-docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ============ 消息中心 ============
  platform-message:
    image: ghcr.io/fkeu520/cloudplatform/platform-message:latest
    container_name: platform-message
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/platform_message?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai'
      - SPRING_DATASOURCE_USERNAME=platform
      - SPRING_DATASOURCE_PASSWORD=platform123
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=nacos:8848
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MYBATIS_PLUS_SNOWFLAKE_WORKER_ID=1
      - MYBATIS_PLUS_SNOWFLAKE_DATACENTER_ID=2
      - JAVA_OPTS=${JAVA_OPTS:--Xmx768m -Xms384m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof}
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8085/message/site/unread-count"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ============ 认证中心 ============
  platform-auth:
    image: ghcr.io/fkeu520/cloudplatform/platform-auth:latest
    container_name: platform-auth
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai'
      - SPRING_DATASOURCE_USERNAME=platform
      - SPRING_DATASOURCE_PASSWORD=platform123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=nacos:8848
      - USER_SERVICE_URL=http://platform-user:8081
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8082/auth/v3/api-docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ============ 工作流引擎 ============
  platform-workflow:
    image: ghcr.io/fkeu520/cloudplatform/platform-workflow:latest
    container_name: platform-workflow
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - 'SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai'
      - SPRING_DATASOURCE_USERNAME=platform
      - SPRING_DATASOURCE_PASSWORD=platform123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=nacos:8848
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MYBATIS_PLUS_SNOWFLAKE_WORKER_ID=1
      - MYBATIS_PLUS_SNOWFLAKE_DATACENTER_ID=2
      - JAVA_OPTS=${JAVA_OPTS:--Xmx1024m -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8084/workflow/v3/api-docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ============ API 网关 ============
  platform-gateway:
    image: ghcr.io/fkeu520/cloudplatform/platform-gateway:latest
    container_name: platform-gateway
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - REDIS_HOST=redis
      - CORS_ORIGINS=http://localhost:8080,http://localhost:8090
      - JWT_SECRET=${JWT_SECRET:-cloudhub-platform-secret-key-2024-change-in-production}
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof}
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *default-logging

  # ============ 运营管理后端 ============
  platform-ops:
    image: ghcr.io/fkeu520/cloudplatform/platform-ops:latest
    container_name: platform-ops
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai'
      - SPRING_DATASOURCE_USERNAME=platform
      - SPRING_DATASOURCE_PASSWORD=platform123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=nacos:8848
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - MYBATIS_PLUS_SNOWFLAKE_WORKER_ID=4
      - MYBATIS_PLUS_SNOWFLAKE_DATACENTER_ID=1
      - JAVA_OPTS=${JAVA_OPTS:--Xmx768m -Xms384m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8087/ops/v3/api-docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ============ 运营管理前端 ============
  platform-ops-admin:
    image: ghcr.io/fkeu520/cloudplatform/platform-ops-admin:latest
    container_name: platform-ops-admin
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - platform-ops
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ============ Kafka UI ============
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: platform-kafka-ui
    restart: unless-stopped
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # ============ Zipkin 链路追踪 (M6 P1-1) ============
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: platform-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    logging: *default-logging

  # ============ Prometheus (M6 P1-5 指标采集) ============
  prometheus:
    image: prom/prometheus:latest
    container_name: platform-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    logging: *default-logging

  # ============ Grafana (M6 P1-5 监控看板) ============
  grafana:
    image: grafana/grafana:latest
    container_name: platform-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    logging: *default-logging

  # ============ 前端服务 ============
  platform-admin:
    image: ghcr.io/fkeu520/cloudplatform/platform-admin:latest
    container_name: platform-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - platform-user
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  nacos-data:
  nacos-logs:
  minio-data:
  es-data:
  xxl-job-data:
  prometheus-data: