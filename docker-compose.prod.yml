# ==============================================================================
# 云枢中台 · 生产环境 Docker Compose Override 模板
# ==============================================================================
#
# 用途：覆盖 docker-compose.yml 中的生产环境配置
#       - 后端服务 JVM 内存限制
#       - 所有服务 CPU / 内存资源限制
#       - MySQL 密码从环境变量读（不再硬编码）
#
# 用法：
#   # 4C8G 单机（默认）
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.ghcr.yml \
#     -f docker-compose.prod.yml \
#     up -d
#
#   # 8C16G 单机：改下方的"资源配置档位"块
#   # 找到 "=== 4C8G 默认 ===" 段, 替换为 "=== 8C16G ===" 段
#
# 内存预算（4C8G）：
#   OS:                  ~1.0 GB
#   MySQL:               1.5 GB (innodb_buffer_pool_size)
#   Redis:               0.25 GB
#   Kafka:               0.5 GB
#   Nacos:               0.5 GB
#   Elasticsearch:       1.0 GB
#   Logstash:            0.5 GB
#   Kibana + 工具:       0.5 GB
#   6 个后端 (各 ~0.4G): 2.4 GB
#   缓冲:                ~0.4 GB
#   --------------------
#   合计:                ~8.0 GB ✅
#
# 内存预算（8C16G）：
#   OS:                  ~1.5 GB
#   MySQL:               3.0 GB
#   Redis:               0.5 GB
#   Kafka:               1.0 GB
#   Nacos:               1.0 GB
#   Elasticsearch:       2.0 GB
#   Logstash:            1.0 GB
#   Kibana + 工具:       1.0 GB
#   6 个后端 (各 ~0.8G): 4.8 GB
#   缓冲:                ~0.2 GB
#   --------------------
#   合计:                ~16.0 GB ✅
#
# 配套文档：doc/部署指南.md §8 生产环境部署
# 决策记录：HANDOFF_2026-06-05.md (P1 docker-compose.prod.yml 任务)
# ==============================================================================

# ==============================================================================
# 1. 敏感配置（生产环境从 .env 文件或 CI 注入）
# ==============================================================================
# 使用前请创建 .env.prod 文件，参考：
#   MYSQL_ROOT_PASSWORD=...
#   MYSQL_PASSWORD=...
#   JWT_SECRET=...
#   NACOS_PASSWORD=...
#   MINIO_ROOT_PASSWORD=...
#
# 然后用 --env-file 加载：
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d

# ==============================================================================
# 2. 后端服务 · 8C16G 默认配置（单机部署）
# ==============================================================================
# JVM 配置：
#   MaxRAMPercentage=70 (容器内存的 70% 作为堆，剩余给元空间/线程/直接内存)
#   UseContainerSupport (JDK 11+ 自动识别 cgroup 限制, 关键!)
#   G1GC + ParallelRefProcEnabled (低延迟, 适合 Web 场景)
#   +UseStringDeduplication (L2 Phase A: 去重字符串节省堆)
#   +HeapDumpOnOutOfMemoryError (OOM 时自动 dump)
#
# 内存预算（8C16G）：
#   OS:                  ~1.5 GB
#   MySQL:               3.0 GB
#   Redis:               0.5 GB
#   Kafka:               1.0 GB
#   Nacos:               1.0 GB
#   Elasticsearch:       2.0 GB
#   Logstash:            1.0 GB
#   Kibana + 工具:       1.0 GB
#   6 个后端 (各 ~0.8G): 4.8 GB
#   缓冲:                ~0.2 GB
#   --------------------
#   合计:                ~16.0 GB ✅
# ==============================================================================

services:
  # ============ 后端服务 (6 个) ============

  platform-user:
    environment:
      # 8C16G: 512MB 堆, 容器限 1G
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseContainerSupport -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1G
        reservations:
          cpus: '0.50'
          memory: 512M
    restart: always

  platform-auth:
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseContainerSupport -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 768M
        reservations:
          cpus: '0.50'
          memory: 384M
    restart: always

  platform-gateway:
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseContainerSupport -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1.5G
        reservations:
          cpus: '1.00'
          memory: 768M
    restart: always

  platform-workflow:
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseContainerSupport -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1.5G
        reservations:
          cpus: '1.00'
          memory: 768M
    restart: always

  platform-message:
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseContainerSupport -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
        reservations:
          cpus: '0.50'
          memory: 512M
    restart: always

  platform-ops:
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseContainerSupport -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1G
        reservations:
          cpus: '0.50'
          memory: 512M
    restart: always

  # ============ 中间件服务 ============

  mysql:
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须设置}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD 必须设置}
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 3G
        reservations:
          cpus: '1.00'
          memory: 2G
    restart: always

  redis:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 128M
    restart: always

  kafka:
    environment:
      # 8C16G: KAFKA 堆放大到 1G
      - KAFKA_HEAP_OPTS=-Xms512M -Xmx1G
      - KAFKA_NUM_PARTITIONS=6
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1.5G
        reservations:
          cpus: '0.50'
          memory: 1G
    restart: always

  nacos:
    environment:
      - JVM_XMS=512m
      - JVM_XMX=1G
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN 必须设置}
      - NACOS_AUTH_IDENTITY_KEY=cloudhub
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:?NACOS_AUTH_IDENTITY_VALUE 必须设置}
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1.5G
        reservations:
          cpus: '0.50'
          memory: 1G
    restart: always

  elasticsearch:
    environment:
      - ES_JAVA_OPTS=-Xms1g -Xmx2g
      - bootstrap.memory_lock=false
      - "ES_JVM_OPTIONS_DOCKER_DISABLE_PREFLIGHT_CHECKS=true"
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 3G
        reservations:
          cpus: '1.00'
          memory: 2G
    restart: always

  kibana:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 256M
    restart: always

  logstash:
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx1G
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1.5G
        reservations:
          cpus: '0.50'
          memory: 1G
    restart: always

  minio:
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER 必须设置}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 必须设置}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: always

  xxl-job-admin:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 256M
    restart: always

  # ============ 前端服务 (Nginx) ============

  platform-admin:
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M
    restart: always

  platform-ops-admin:
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M
    restart: always

  kafka-ui:
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M
    restart: always


# ==============================================================================
# 3. 生产环境强烈建议（但不在本 override 范围）
# ==============================================================================
# A. 关闭 GELF 调试日志（开发用）
#    在 docker-compose.yml 中, 各服务 logging: *default-logging 行注释掉
#    改用 filebeat / fluentd sidecar 收集到 ES
#
# B. 关闭 Docker UI（kafka-ui, xxl-job-admin）
#    在生产环境, 这些 UI 仅限内网访问, 建议通过 firewall 限制
#    或在 override 中 ports 改为 127.0.0.1:8089:8080 (仅本机)
#
# C. 启用 HTTPS
#    前端 platform-admin / platform-ops-admin 前置 Nginx 反代
#    TLS 终止在 Nginx, 不在本 override 范围
#
# D. 数据库主从
#    当前单 MySQL 容器, 生产建议:
#    - MySQL Group Replication (MGR) 多写
#    - 或 MySQL 主从 + ProxySQL 读写分离
#    留到 M7 韧性阶段
# ==============================================================================
